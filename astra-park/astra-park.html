:root{
  --bg:#0d0b1a; --bg2:#151130; --line:#2c2752;
  --fg:#f3f0ff; --dim:#9b94c4; --faint:#635c92;
  --p1:#3da9ff; --p2:#ff8a3d;
  --good:#53e59a; --bad:#ff5d73; --gold:#ffd24a;
  --ui:"Fredoka",ui-rounded,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --safe:clamp(12px,2.6vmin,40px);
  --sys:"Segoe UI Variable Display","Segoe UI","SF Pro Display",-apple-system,Inter,system-ui,Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--ui);color:var(--fg);-webkit-font-smoothing:antialiased;}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}
#ui{position:fixed;inset:0;pointer-events:none;}
/* The dwell ring lives above the interface, not behind it. */
#over{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;}
#ui > *{pointer-events:auto;}

.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(14px,3vh,40px);
  padding:var(--safe);text-align:center;
}
.screen.dim{background:rgba(9,7,20,.88);}
.screen.dim.pause{background:rgba(9,7,20,.6);}
.screen.dim.lost{background:rgba(9,7,20,.55);}
.screen.lost .lede{ color:#fff6e2; text-shadow:0 1px 4px rgba(0,0,0,.5); }
.stepin{ width:clamp(120px,30vh,320px); height:clamp(120px,30vh,320px); color:#fff6e2; }
.stepin svg{ width:100%; height:100%; filter:drop-shadow(0 .4vh 1.2vh rgba(0,0,0,.4)); }
.stepin .kid{ animation:stepin 1.8s ease-in-out infinite; }
@keyframes stepin{ 0%{ transform:translateX(-26px); opacity:.3 } 50%,100%{ transform:translateX(0); opacity:1 } }

/* ---------- the end of a round ----------
   The game's own ending stays in view; the way on sits along the bottom. */
.screen.end{
  justify-content:flex-end; padding-bottom:clamp(24px,7vh,90px);
  background:linear-gradient(180deg, rgba(9,7,20,0) 45%, rgba(9,7,20,.55) 100%);
}
.endname{
  font-size:clamp(28px,7vh,84px); font-weight:600; color:#fff6e2;
  text-shadow:0 0 .3em rgba(0,0,0,.45), 0 .05em 0 rgba(40,30,70,.4);
}
.bigrow{ gap:clamp(16px,4vw,64px); }
.btn.big{
  display:flex; align-items:center; gap:.5em;
  min-width:min(36vw,520px); justify-content:center;
  padding:clamp(16px,3.6vh,40px) clamp(20px,3vw,44px);
  font-size:clamp(20px,4.4vh,52px); font-weight:600; border-radius:999px;
  border:clamp(4px,.6vh,7px) solid rgba(255,255,255,.85);
  box-shadow:0 clamp(6px,1.2vh,14px) clamp(16px,3vh,36px) rgba(0,0,0,.3);
}
.btn.big .lbl{ display:flex; align-items:center; gap:.45em; }
.btn.big .ic{ width:1.3em; height:1.3em; display:inline-flex; }
.btn.big .ic svg{ width:100%; height:100%; }
.btn.big.go{ background:var(--accent,#53e59a); color:#1a1430; }
.btn.big.home{ background:#fff6e2; color:#2b2440; }
.btn.big .fill{ background:#fff; opacity:.35; }
.btn.big.hot{ transform:scale(1.05); }
h1{font-size:clamp(34px,9vh,110px);font-weight:900;letter-spacing:-.03em;line-height:.92;}
h2{font-size:clamp(22px,5vh,60px);font-weight:800;letter-spacing:-.02em;}
.lede{font-size:clamp(14px,2.4vh,26px);color:var(--dim);max-width:46ch;line-height:1.5;}

/* Hover-to-select: every control is a .btn and the ring fills as you dwell. */
.btn{
  position:relative;border:3px solid var(--line);background:var(--bg2);color:var(--fg);
  border-radius:clamp(14px,2.2vh,26px);padding:clamp(12px,2.2vh,26px) clamp(18px,3vw,38px);
  font:inherit;font-size:clamp(15px,2.6vh,30px);font-weight:800;cursor:pointer;
  overflow:hidden;transition:transform .12s ease,border-color .12s ease;
}
.btn .fill{
  position:absolute;inset:0;background:var(--who,currentColor);opacity:.22;
  transform-origin:left center;transform:scaleX(0);pointer-events:none;
}
.btn.hot{border-color:var(--who,currentColor);transform:scale(1.04);}
.btn:focus-visible{outline:4px solid var(--fg);outline-offset:4px;}

/* Sized by the cards rather than a fixed column count: with two games a
   four-column grid shoves them into a corner, and the catalogue grows. */
.grid{
  display:grid;gap:clamp(10px,1.8vh,24px);
  width:min(96vw,1700px);justify-content:center;
  grid-template-columns:repeat(auto-fit,minmax(clamp(220px,19vw,330px),1fr));
}
@media (max-aspect-ratio:1/1){
  .grid{grid-template-columns:repeat(auto-fit,minmax(clamp(150px,40vw,330px),1fr));}
}
.card{
  display:flex;flex-direction:column;gap:.4em;align-items:flex-start;text-align:left;
  min-height:clamp(96px,15vh,170px);justify-content:center;
  border-top-width:9px;border-top-color:var(--accent,var(--p1));
}
.card .nm{font-size:clamp(17px,3.1vh,36px);font-weight:900;line-height:1.05;}
.card .meta{display:flex;gap:.7em;align-items:baseline;font-size:clamp(11px,1.6vh,18px);
  color:var(--dim);font-weight:700;}
.stars{color:var(--gold);letter-spacing:.08em;}
.best{color:var(--faint);}

.topbar{
  position:absolute;top:var(--safe);left:var(--safe);right:var(--safe);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar .brand{font-size:clamp(18px,3.4vh,40px);font-weight:900;letter-spacing:-.02em;}
.topbar .tools{display:flex;gap:clamp(6px,1vw,14px);}
.topbar .btn{padding:clamp(8px,1.4vh,16px) clamp(12px,1.8vw,24px);font-size:clamp(12px,1.8vh,20px);}

.row{display:flex;gap:clamp(10px,2vw,28px);flex-wrap:wrap;justify-content:center;}
.bullets{display:flex;flex-direction:column;gap:.6em;font-size:clamp(14px,2.4vh,28px);
  text-align:left;max-width:30ch;}
.bullets li{list-style:none;display:flex;gap:.6em;align-items:baseline;}
.bullets .ic{font-size:1.2em;}
.dot{width:.8em;height:.8em;border-radius:50%;display:inline-block;}
.hide{display:none!important;}
label.slider{display:flex;align-items:center;gap:1em;font-size:clamp(13px,2.2vh,26px);font-weight:700;}
input[type=range]{width:min(50vw,420px);height:2.2vh;}

.warn{
  display:inline-flex;align-items:center;
  background:#3a1f12;color:#ffb37a;border:2px solid #7a3f1e;
  border-radius:999px;padding:clamp(7px,1.3vh,14px) clamp(12px,1.7vw,22px);
  font-size:clamp(11px,1.7vh,19px);font-weight:800;
}


/* ---------- title screen ----------
   A ten-foot front door: the name, the park, and a friend to wave to. The
   corners are kept clear, and the type is big enough that the name is the
   first thing anyone sees from the sofa. */
.screen.title{ justify-content:flex-start; padding-top:clamp(18px,5vh,70px); gap:clamp(8px,1.6vh,22px); }

/* The name, soft and warm, with the evening star tucked between the words.
   It floats a little, the way everything on this screen does. */
.logo{
  display:flex; align-items:flex-start; gap:.18em;
  font-size:clamp(48px,14vh,180px); font-weight:600; line-height:1; letter-spacing:.005em;
  color:#fff6e2;
  text-shadow:0 0 .3em rgba(255,196,140,.55), 0 .05em 0 rgba(70,50,100,.35);
  animation:float 5s ease-in-out infinite;
}
.logo .star{ width:.32em; height:.32em; margin:-.06em -.06em 0; animation:twinkle 2.4s ease-in-out infinite; }
.logo .star svg{ width:100%; height:100%; fill:#ffe9a8; filter:drop-shadow(0 0 .12em rgba(255,236,170,.9)); }
@keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-.05em) } }
@keyframes twinkle{ 0%,100%{ transform:scale(1) rotate(0); opacity:1 } 50%{ transform:scale(.8) rotate(20deg); opacity:.75 } }

/* Corner furniture: deliberately small and far out, so a waving hand can
   never clip it. */
.btn.corner{
  position:absolute; top:var(--safe); right:var(--safe);
  width:clamp(44px,7vh,80px); height:clamp(44px,7vh,80px); padding:0;
  border-radius:50%; font-size:clamp(18px,3.2vh,38px); opacity:.55;
}
.btn.corner.hot{ opacity:1; }

.camstatus{
  position:absolute; top:var(--safe); left:var(--safe);
  display:flex; align-items:center; gap:.6em;
  font-size:clamp(12px,1.9vh,22px); font-weight:700; color:var(--dim);
}
.buildstamp{
  position:absolute; bottom:var(--safe); left:var(--safe);
  font-size:clamp(11px,1.6vh,18px); font-weight:700; color:#fff; opacity:.75;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  font-variant-numeric:tabular-nums;
}
.camstatus .dot{
  width:clamp(10px,1.5vh,18px); height:clamp(10px,1.5vh,18px);
  border-radius:50%; background:var(--gold);
  box-shadow:0 0 0 clamp(3px,.5vh,6px) rgba(255,255,255,.10);
}

/* ---------- game picker ----------
   Picture tiles on the same park as the title. Sized so the whole catalogue
   is on screen at once: a child who has to scroll to find a game picks
   whichever one is already visible. */
.screen.picker{
  justify-content:center; gap:clamp(8px,1.8vh,22px);
  padding:clamp(60px,11vh,130px) var(--safe) var(--safe);
}

.logo.small{
  position:absolute; top:var(--safe); left:var(--safe);
  font-size:clamp(20px,4.2vh,48px); animation:none;   /* it floats on the title; here it is furniture */
}

.corners{
  position:absolute; top:var(--safe); right:var(--safe);
  display:flex; gap:clamp(8px,1.2vw,16px);
}
.corners .btn.corner{ position:static; }

.warnstrip{
  background:rgba(255,93,115,.16); border:2px solid rgba(255,93,115,.5);
  color:#ffb3bd; font-weight:800; border-radius:999px;
  padding:.35em 1em; font-size:clamp(11px,1.8vh,20px);
}
/* Big picture tiles: each a window onto its game, so it is chosen by look.
   The accent colour frames it; the name is small, underneath. */
.tiles{
  /* As wide as the screen allows, but never so tall that a second row of
     games falls off the bottom. */
  --tile:min(760px, calc((90vw - (var(--cols,2) - 1) * 3vw) / var(--cols,2)),
             calc((78vh / var(--rows,1) - 9vh) / 0.625));
  display:grid; gap:clamp(14px,2.4vh,40px) clamp(14px,3vw,48px);
  grid-template-columns:repeat(var(--cols,2),var(--tile));
}
@media (max-aspect-ratio:1/1){ .tiles{ grid-template-columns:1fr; width:min(80vw,560px); } }

.btn.tile{
  display:flex; flex-direction:column; align-items:stretch; padding:0;
  border:clamp(4px,.7vh,8px) solid var(--accent); border-radius:clamp(20px,3.4vh,40px);
  background:#151130;
  box-shadow:0 clamp(8px,1.6vh,20px) clamp(18px,4vh,50px) rgba(10,8,30,.45),
             0 0 clamp(16px,3vh,40px) color-mix(in srgb, var(--accent) 35%, transparent);
}
.btn.tile .pic{ display:block; width:100%; aspect-ratio:16/10; }

  font-size:clamp(18px,3.8vh,44px); font-weight:600; color:#fff6e2;
  background:color-mix(in srgb, var(--accent) 30%, #1a1534);
}
.btn.tile.hot{ transform:scale(1.04); border-color:var(--accent); }

.grid .placerow .btn.tile .lbl{ flex:1; height:100%; padding:0 .5em; }
.grid .placerow .btn.tile .soon{ top:auto; bottom:8%; right:5%; font-size:clamp(10px,1.5vh,18px); }
.tilemoves{ display:flex; justify-content:center; gap:.2em; padding:0 .4em .5em; font-size:clamp(14px,2.6vh,30px); background:color-mix(in srgb, var(--accent) 30%, #1a1534); position:relative; z-index:2; }
.screen.home .moves, .screen.home .meta{ display:none; }
.grid .btn.tile{
  display:flex; flex-direction:column; min-height:0; padding:0; overflow:hidden;
  border:clamp(3px,.5vh,6px) solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius:clamp(14px,2.4vh,28px);
  background:#151130; box-shadow:0 1vh 2.4vh rgba(10,8,30,.4);
  transition:transform .25s ease, border-color .25s, box-shadow .25s;
}
.grid .btn.tile .pic{ min-height:0; width:100%; display:block; }
.grid .btn.tile .lbl{ flex:none; font-size:clamp(14px,3vh,36px); padding:.35em .4em .2em; }
.grid .btn.tile.place .lbl{ font-size:clamp(12px,2.2vh,26px); }
.grid .btn.tile.focus{
  transform:translateY(-1vh) scale(1.05); z-index:2; border-color:var(--accent);
  box-shadow:0 1.4vh 3vh rgba(10,8,30,.5), 0 0 3vh color-mix(in srgb, var(--accent) 60%, transparent);
}
.grid .btn.tile.launch{ animation:pulse .5s ease both; }
@keyframes pulse{ 50%{ transform:translateY(-.8vh) scale(1.12) } }
.grid .btn.tile.nope{ animation:nope .45s ease; }
@keyframes nope{ 20%{ transform:translateX(-.8vw) rotate(-2deg) } 40%{ transform:translateX(.7vw) rotate(1.5deg) } 60%{ transform:translateX(-.4vw) } 80%{ transform:translateX(.2vw) } }
.btn.tile .soon{
  position:absolute; top:6%; right:6%; z-index:3;
  background:rgba(20,16,44,.75); color:#fff6e2; border-radius:999px;
  padding:.2em .45em; font-size:clamp(11px,1.8vh,22px);
}
.screen.dim.family{ background:rgba(9,7,20,.35); }
.familyspace{ width:80vw; height:30vh; }

/* ---------- boot ----------
   The front door's own name, in its own place, blooming in over the park
   as it comes up out of the night - so the boot show becomes the title
   screen without a seam. The title's corner furniture fades in after. */
.logo.bloom{ animation:bloom .7s 1.15s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes bloom{ from{ opacity:0; transform:scale(.7); filter:blur(8px) } to{ opacity:1; transform:none; filter:none } }
.bootwait{ position:absolute; bottom:8vh; left:0; right:0; opacity:0; transition:opacity .6s; color:#fff6e2; }
.bootwait.show{ opacity:.8; }
.screen.title:not(.boot) .camstatus, .screen.title:not(.boot) .btn.corner, .screen.title:not(.boot) .buildstamp{ animation:fadein .8s ease both; }
@keyframes fadein{ from{ opacity:0 } }


/* ---------- MoveCube: the boot and the home screen ----------
   Light and clean, like a TV box: soft paper, white cards, one colour at a
   time. Sized against the screen's height, for reading from the sofa. */
.screen.boot .bootwait{ color:#5b5f6e; font-family:var(--sys); bottom:12vh; }
.screen.tvhome{ padding:0; display:block; text-align:left; color:#16161d; font-family:var(--sys); }
.tvtop{ position:absolute; top:3vh; left:4vw; right:4vw; height:6vh; display:flex; align-items:center; justify-content:space-between; }
.tvtop .brand{ display:flex; align-items:center; gap:.45em; font-size:3.4vh; font-weight:600; letter-spacing:-.01em; }
.tvtop .mark{ width:1.25em; height:1.25em; display:inline-flex; }
.tvtop .mark svg{ width:100%; height:100%; }
.tvsys{ display:flex; align-items:center; gap:1.4vw; font-size:3.2vh; font-weight:500; font-variant-numeric:tabular-nums; }
.tvplayers{ width:24vh; height:5.4vh; }
.screen.tvhome .camdot{ box-shadow:0 0 0 .18em rgba(0,0,0,.06); }
.screen.tvhome .warnstrip{ position:absolute; top:4vh; left:50%; transform:translateX(-50%); background:#fff1f2; color:#be123c; border-color:#fecdd3; }
.hero{
  position:absolute; top:11.5vh; left:4vw; right:4vw; height:40vh; border-radius:3vh; overflow:hidden;
  background:#1c1a33; box-shadow:0 2vh 5vh rgba(30,40,90,.22);
}
.heropic{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.heroshade{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,12,30,.82) 0%, rgba(10,12,30,.55) 38%, rgba(10,12,30,0) 72%); }
.herotext{ position:absolute; left:3.6vw; top:0; bottom:0; max-width:58%; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:1.5vh; color:#fff; }
.hname{ font-size:7.2vh; font-weight:700; letter-spacing:-.02em; line-height:1.02; text-shadow:0 .3vh 1.5vh rgba(0,0,0,.3); }
.hblurb{ font-size:2.8vh; opacity:.9; line-height:1.3; }
.hmoves{ display:flex; gap:.8vh; flex-wrap:wrap; font-size:2.1vh; font-weight:500; }
.hmoves .mv{ display:inline-flex; align-items:center; gap:.35em; background:rgba(255,255,255,.17); border-radius:999px; padding:.28em .85em; }
.hmoves .mi{ font-size:1.25em; line-height:1; }
.btn.play{
  margin-top:1vh; background:#fff; color:#15132b; border:none; border-radius:999px;
  padding:1.3vh 3.4vh; font-family:inherit; font-size:3vh; font-weight:700;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn.play .lbl{ display:flex; align-items:center; gap:.5em; }
.btn.play .tri{ width:0; height:0; border-left:.72em solid currentColor; border-top:.42em solid transparent; border-bottom:.42em solid transparent; }
.btn.play .fill{ background:var(--accent); opacity:.3; }
.btn.play.hot, body.remote .btn.play.kfocus{ transform:scale(1.07); box-shadow:0 0 0 .5vh var(--accent), 0 1vh 3vh rgba(0,0,0,.35); }
.shelves{ position:absolute; top:53vh; bottom:0; left:0; right:0; overflow:hidden; }
.shelfwrap{ padding-top:2vh; transition:transform .45s cubic-bezier(.2,.8,.2,1); }
.shelf{ padding:0 4vw 2.4vh; }
.shelf h3{ font-size:2.9vh; font-weight:700; margin:0 0 2.6vh; color:#1b1b25; letter-spacing:-.01em; }
.shelfrow{ display:flex; gap:2vw; transition:transform .45s cubic-bezier(.2,.8,.2,1); }
.btn.tvtile{
  flex:none; width:16vw; padding:0; border:none; background:transparent; overflow:visible; border-radius:0;
  display:flex; flex-direction:column; align-items:stretch; gap:1.1vh; color:#24242e; font-family:inherit;
}
.btn.tvtile .pic{
  width:100%; aspect-ratio:16/10; display:block; border-radius:2vh; background:var(--accent);
  box-shadow:0 1vh 2.4vh rgba(30,40,90,.16); transition:transform .25s ease, box-shadow .25s ease;
}
.btn.tvtile .fill{ bottom:auto; aspect-ratio:16/10; border-radius:2vh; background:#fff; opacity:.35; z-index:2; }
.btn.tvtile .lbl{ font-size:2.3vh; font-weight:500; text-align:center; transition:font-weight .2s; }
.btn.tvtile.hot{ transform:none; }
.btn.tvtile.focus .pic{ transform:translateY(-.8vh) scale(1.07); box-shadow:0 0 0 .5vh #fff, 0 0 0 1vh var(--accent), 0 2.4vh 4vh rgba(30,40,90,.3); }
.btn.tvtile.focus .lbl{ font-weight:700; }
.shelf.places .btn.tvtile{ width:11vw; }
.btn.tvtile .soon{ position:absolute; top:1vh; right:1vh; z-index:3; background:rgba(20,16,44,.72); color:#fff; border-radius:999px; padding:.2em .65em; font-size:1.6vh; font-weight:600; }
.btn.tvtile.launch .pic{ animation:tvpulse .5s ease both; }
@keyframes tvpulse{ 50%{ transform:translateY(-1vh) scale(1.14) } }
.btn.tvtile.nope .pic{ animation:nope .45s ease; }
.btn.tvtile.fly{ animation:tilefly .7s cubic-bezier(.2,.8,.25,1) both; }
@keyframes tilefly{ from{ transform:translate(var(--fx),var(--fy)) scale(.25) rotate(var(--fr)); opacity:0 } 12%{ opacity:1 } to{ transform:none; opacity:1 } }
.screen.tvhome.arrive .tvtop{ animation:fadein .6s .35s ease both; }
.screen.tvhome.arrive .hero{ animation:heroin .7s .2s cubic-bezier(.2,.8,.25,1) both; }
.screen.tvhome.arrive .shelf h3{ animation:fadein .6s .5s ease both; }
@keyframes heroin{ from{ opacity:0; transform:scale(.96) } to{ opacity:1; transform:none } }
.screen.tvhome .buildstamp{ bottom:1.2vh; left:auto; right:4vw; z-index:3; color:#4b4f5e; text-shadow:none; opacity:.55; font-size:1.4vh; }
/* the remote's highlight, on every other button */
body.remote .btn.kfocus:not(.tvtile):not(.play){ outline:.5vh solid #fff; outline-offset:.5vh; transform:scale(1.05); }

/* ---------- MoveCube: everything else, in the same light style ----------
   Windows (settings, help, family, pause, "step back in", the camera check)
   are frosted glass over whatever's behind; buttons are white pills with
   dark type; the end of a round fades up to paper at the bottom. */
body{ font-family:var(--sys); }
.screen{ font-family:var(--sys); }
.screen.dim{ background:rgba(236,238,244,.66); -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3); color:#16161d; }
.screen.dim.pause{ background:rgba(236,238,244,.5); }
.screen.dim.lost{ background:rgba(236,238,244,.55); }
.screen.dim.family{ background:rgba(236,238,244,.7); }
.screen.lost .lede{ color:#2b2d3a; text-shadow:none; }
.stepin{ color:#3a3d50; }
.stepin svg{ filter:none; }
h1, h2{ font-family:var(--sys); color:#16161d; font-weight:700; letter-spacing:-.02em; }
.lede{ color:#5b5f6e; font-weight:400; }
.bullets{ color:#24242e; font-weight:400; text-align:left; }
label.slider{ color:#24242e; font-weight:600; }
input[type=range]{ accent-color:#6d5efc; }
.btn{
  font-family:var(--sys); font-weight:600; color:#16161d; background:#fff;
  border:2px solid rgba(20,24,50,.08); border-radius:999px;
  box-shadow:0 .6vh 1.8vh rgba(30,40,90,.12);
}
.btn .fill{ background:var(--who,#6d5efc); opacity:.18; }
.btn.hot{ border-color:var(--who,#6d5efc); transform:scale(1.05); }
body.remote .btn.kfocus:not(.tvtile):not(.play){ outline:none; transform:scale(1.07); border-color:transparent; box-shadow:0 0 0 .5vh #6d5efc, 0 1.2vh 3vh rgba(30,40,90,.22); }
.screen.dim .row{ gap:clamp(10px,1.6vw,24px); }
/* the end of a round, and pause: two big pills */
.screen.end{ background:linear-gradient(180deg, rgba(243,244,247,0) 40%, rgba(243,244,247,.92) 100%); }
.endname{ font-family:var(--sys); color:#16161d; font-weight:700; letter-spacing:-.02em; text-shadow:0 0 1.5vh rgba(255,255,255,.8); }
.btn.big{ font-family:var(--sys); font-weight:700; border:none; box-shadow:0 1.2vh 3vh rgba(30,40,90,.2); }
.btn.big.go{ background:var(--accent,#6d5efc); color:#fff; text-shadow:0 .1vh .4vh rgba(0,0,0,.25); }
.btn.big.home{ background:#fff; color:#16161d; }
.btn.big .fill{ background:#fff; opacity:.3; }
.btn.big.hot{ transform:scale(1.06); box-shadow:0 0 0 .5vh var(--who,#6d5efc), 0 1.4vh 3.4vh rgba(30,40,90,.25); }
.warn, .warnstrip{ background:#fff1f2; color:#be123c; border:2px solid #fecdd3; font-family:var(--sys); font-weight:600; }
.screen.boot .bootwait{ color:#5b5f6e; }
.screen.dim .bullets{ max-width:min(80vw,62ch); font-size:clamp(14px,2.6vh,30px); gap:.8em; }
.screen.dim.family{ background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; }
:root{ --dim:#5b5f6e; --faint:#8a8ea0; --good:#16a34a; --bad:#e11d48; }
/* the banner and the rows: room between them, on any screen shape, for the
   picked tile to lift without touching the banner */
.hero{ height:37vh; }
.shelves{ top:50.5vh; }
.shelfwrap{ padding-top:3.2vh; }
.btn.tvtile, .btn.tvtile.hot{ box-shadow:none; border:none; background:transparent; }
/* the corner menu: a round button with three bars, and a little card under it */
.btn.burger{ width:5.6vh; height:5.6vh; padding:0; display:inline-flex; align-items:center; justify-content:center; margin-left:.4vw; }
.btn.burger .lbl{ display:flex; }
.btn.burger .bars{ display:flex; flex-direction:column; gap:.55vh; }
.btn.burger .bars i{ display:block; width:2.4vh; height:.32vh; border-radius:1vh; background:#16161d; }
.screen.dim.popmenu{ background:rgba(236,238,244,.35); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.popcard{
  position:absolute; top:10.5vh; right:4vw; min-width:22vw; padding:1.2vh; border-radius:2.6vh;
  background:rgba(255,255,255,.96); box-shadow:0 2vh 5vh rgba(30,40,90,.22), 0 0 0 1px rgba(20,24,50,.06);
  display:flex; flex-direction:column; gap:.6vh; animation:popin .22s cubic-bezier(.2,.8,.25,1) both; transform-origin:top right;
}
@keyframes popin{ from{ opacity:0; transform:scale(.92) translateY(-1vh) } to{ opacity:1; transform:none } }
.btn.popitem{ width:100%; border:none; box-shadow:none; border-radius:1.6vh; background:transparent; padding:1.5vh 1.6vh; font-size:2.8vh; text-align:left; }
.btn.popitem .lbl{ display:flex; align-items:center; gap:.7em; }
.btn.popitem .pi{ font-size:1.1em; width:1.4em; text-align:center; }
.btn.popitem .pn{ flex:1; }
.btn.popitem .soon{ position:static; font-size:.6em; font-weight:600; color:#fff; background:#2b2d3a; border-radius:999px; padding:.25em .7em; }
.btn.popitem.close{ color:#5b5f6e; justify-content:center; }
.btn.popitem.close .lbl{ justify-content:center; }
.btn.popitem.hot, body.remote .btn.popitem.kfocus{ background:#eef0f6; box-shadow:none; transform:none; }
body.remote .btn.popitem.kfocus{ box-shadow:inset 0 0 0 .4vh #6d5efc; }
.btn.popitem.nope{ animation:nope .45s ease; }
/* the game icons: the cube's style - a rounded square in two colours with a
   soft shine, and a simple white picture */
.btn.tvtile{ width:12vw; }
.btn.tvtile .icon{
  position:relative; width:100%; aspect-ratio:1; border-radius:23%; overflow:hidden;
  background:linear-gradient(135deg, var(--c1), var(--c2));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1.2vh 2.8vh color-mix(in srgb, var(--c1) 35%, transparent), 0 .4vh 1vh rgba(30,40,90,.12);
  transition:transform .25s ease, box-shadow .25s ease;
}
.btn.tvtile .icon::after{ content:''; position:absolute; left:-20%; top:-35%; width:90%; height:70%; border-radius:50%; background:rgba(255,255,255,.22); transform:rotate(-20deg); pointer-events:none; }
.btn.tvtile .icon svg{ width:56%; height:56%; position:relative; z-index:1; filter:drop-shadow(0 .4vh .6vh rgba(0,0,0,.12)); }
.btn.tvtile .fill{ aspect-ratio:1; border-radius:23%; }
.btn.tvtile.focus .icon{ transform:translateY(-.8vh) scale(1.08); box-shadow:0 0 0 .5vh #fff, 0 0 0 1vh var(--accent), 0 2.4vh 4vh rgba(30,40,90,.3); }
.btn.tvtile.launch .icon{ animation:tvpulse .5s ease both; }
.btn.tvtile.nope .icon{ animation:nope .45s ease; }
/* one row of icons now: a taller banner, for the trailer */
.hero{ height:47vh; }
.shelves{ top:60.5vh; }
</style>

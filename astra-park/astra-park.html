:root{
  --bg:#0d0b1a; --bg2:#151130; --line:#2c2752;
  --fg:#f3f0ff; --dim:#9b94c4; --faint:#635c92;
  --p1:#3da9ff; --p2:#ff8a3d;
  --good:#53e59a; --bad:#ff5d73; --gold:#ffd24a;
  --ui:"Fredoka",ui-rounded,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --safe:clamp(12px,2.6vmin,40px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--ui);color:var(--fg);-webkit-font-smoothing:antialiased;}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}
#ui{position:fixed;inset:0;pointer-events:none;}
/* The dwell ring lives above the interface, not behind it. */
#over{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;}
#ui > *{pointer-events:auto;}

.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(14px,3vh,40px);
  padding:var(--safe);text-align:center;
}
.screen.dim{background:rgba(9,7,20,.88);}
.screen.dim.pause{background:rgba(9,7,20,.6);}
.screen.dim.lost{background:rgba(9,7,20,.55);}
.screen.lost .lede{ color:#fff6e2; text-shadow:0 1px 4px rgba(0,0,0,.5); }
.stepin{ width:clamp(120px,30vh,320px); height:clamp(120px,30vh,320px); color:#fff6e2; }
.stepin svg{ width:100%; height:100%; filter:drop-shadow(0 .4vh 1.2vh rgba(0,0,0,.4)); }
.stepin .kid{ animation:stepin 1.8s ease-in-out infinite; }
@keyframes stepin{ 0%{ transform:translateX(-26px); opacity:.3 } 50%,100%{ transform:translateX(0); opacity:1 } }

/* ---------- the end of a round ----------
   The game's own ending stays in view; the way on sits along the bottom. */
.screen.end{
  justify-content:flex-end; padding-bottom:clamp(24px,7vh,90px);
  background:linear-gradient(180deg, rgba(9,7,20,0) 45%, rgba(9,7,20,.55) 100%);
}
.endname{
  font-size:clamp(28px,7vh,84px); font-weight:600; color:#fff6e2;
  text-shadow:0 0 .3em rgba(0,0,0,.45), 0 .05em 0 rgba(40,30,70,.4);
}
.bigrow{ gap:clamp(16px,4vw,64px); }
.btn.big{
  display:flex; align-items:center; gap:.5em;
  min-width:min(36vw,520px); justify-content:center;
  padding:clamp(16px,3.6vh,40px) clamp(20px,3vw,44px);

.grid .placerow .btn.tile .soon{ top:auto; bottom:8%; right:5%; font-size:clamp(10px,1.5vh,18px); }
.tilemoves{ display:flex; justify-content:center; gap:.2em; padding:0 .4em .5em; font-size:clamp(14px,2.6vh,30px); background:color-mix(in srgb, var(--accent) 30%, #1a1534); position:relative; z-index:2; }
.screen.home .moves, .screen.home .meta{ display:none; }
.grid .btn.tile{
  display:flex; flex-direction:column; min-height:0; padding:0; overflow:hidden;
  border:clamp(3px,.5vh,6px) solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius:clamp(14px,2.4vh,28px);
  background:#151130; box-shadow:0 1vh 2.4vh rgba(10,8,30,.4);
  transition:transform .25s ease, border-color .25s, box-shadow .25s;
}
.grid .btn.tile .pic{ min-height:0; width:100%; display:block; }
.grid .btn.tile .lbl{ flex:none; font-size:clamp(14px,3vh,36px); padding:.35em .4em .2em; }
.grid .btn.tile.place .lbl{ font-size:clamp(12px,2.2vh,26px); }
.grid .btn.tile.focus{
  transform:translateY(-1vh) scale(1.05); z-index:2; border-color:var(--accent);
  box-shadow:0 1.4vh 3vh rgba(10,8,30,.5), 0 0 3vh color-mix(in srgb, var(--accent) 60%, transparent);
}
.grid .btn.tile.launch{ animation:pulse .5s ease both; }
@keyframes pulse{ 50%{ transform:translateY(-.8vh) scale(1.12) } }
.grid .btn.tile.nope{ animation:nope .45s ease; }
@keyframes nope{ 20%{ transform:translateX(-.8vw) rotate(-2deg) } 40%{ transform:translateX(.7vw) rotate(1.5deg) } 60%{ transform:translateX(-.4vw) } 80%{ transform:translateX(.2vw) } }
.btn.tile .soon{
  position:absolute; top:6%; right:6%; z-index:3;
  background:rgba(20,16,44,.75); color:#fff6e2; border-radius:999px;
  padding:.2em .45em; font-size:clamp(11px,1.8vh,22px);
}
.screen.dim.family{ background:rgba(9,7,20,.35); }
.familyspace{ width:80vw; height:30vh; }

/* ---------- boot ----------
   The front door's own name, in its own place, blooming in over the park
   as it comes up out of the night - so the boot show becomes the title
   screen without a seam. The title's corner furniture fades in after. */
.logo.bloom{ animation:bloom .7s 1.15s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes bloom{ from{ opacity:0; transform:scale(.7); filter:blur(8px) } to{ opacity:1; transform:none; filter:none } }
.bootwait{ position:absolute; bottom:8vh; left:0; right:0; opacity:0; transition:opacity .6s; color:#fff6e2; }
.bootwait.show{ opacity:.8; }
.screen.title:not(.boot) .camstatus, .screen.title:not(.boot) .btn.corner, .screen.title:not(.boot) .buildstamp{ animation:fadein .8s ease both; }
@keyframes fadein{ from{ opacity:0 } }
</style>
</head>

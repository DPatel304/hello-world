# Builds the Orlis Play Windows app, in two channels.
#
#   Orlis Play Beta - every push that changes the game or the app. For trying
#     things out: its own app beside the normal one, with its own icon and
#     saves, and it updates itself to each new build.
#       https://github.com/dpatel304/hello-world/releases/download/beta/Orlis-Play-Beta-Setup.exe
#
#   Orlis Play - only when released: run this workflow by hand (Actions >
#     Orlis Play for Windows > Run workflow) with channel "release". Everyone
#     with the normal app gets it on their next start.
#       https://github.com/dpatel304/hello-world/releases/latest/download/Orlis-Play-Setup.exe
#
# Versions: astra-park/client/VERSION holds the one people see - 0.1 until
# a milestone, then 0.2 ... and 1.0 at launch - and only changes by hand.
# Each build adds its build number (this workflow's run number) behind it,
# 0.1.<build>, so every build is newer than the last for the updater. In the
# app: "0.1 Beta - build 27" on the beta, "0.1" on the release.
#
# Updates are signed. Add the private signing key as the repository secret
# TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions).
# Until it's there, installers still build, but installed copies can't
# update themselves from them.
name: Orlis Play for Windows

on:
  push:
    branches: [claude/mgs-parody-level-wb4agd]
    paths:
      - 'astra-park/src/**'
      - 'astra-park/client/**'
      - 'astra-park/index.html'
      - 'astra-park/package.json'
      - 'astra-park/package-lock.json'
      - 'astra-park/fetch-assets.mjs'
      - '.github/workflows/orlis-play-windows.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta (try it out) or release (everyone with Orlis Play gets it)'
        type: choice
        options: [beta, release]
        default: beta

permissions:
  contents: write

concurrency:
  group: orlis-play-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: astra-park
    env:
      BUILD: ${{ github.run_number }}
      CHANNEL: ${{ inputs.channel || 'beta' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astra-park/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: astra-park/client/src-tauri -> target

      - name: Install
        run: npm ci

      - name: Build the game files the app carries
        run: npm run client:web

      - name: The channel's name, version and update address
        shell: bash
        run: |
          SHOWN=$(tr -d ' \r\n' < client/VERSION)
          if ! [[ "$SHOWN" =~ ^[0-9]+\.[0-9]+$ ]]; then echo "::error::client/VERSION should be like 0.1 or 1.0, not '$SHOWN'"; exit 1; fi
          VERSION="$SHOWN.$BUILD"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHOWN=$SHOWN" >> $GITHUB_ENV
          signed=true
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            signed=false
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without self-updates."
          fi
          if [ "$CHANNEL" = "release" ]; then
            echo "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":$signed}}" > client/release.json
            echo "TAG=orlis-play-v$VERSION" >> $GITHUB_ENV
            echo "TITLE=Orlis Play $SHOWN" >> $GITHUB_ENV
            echo "LABEL=$SHOWN (build $BUILD)" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
            echo "SETUP=Orlis-Play-Setup.exe" >> $GITHUB_ENV
          else
            cat > client/release.json <<JSON
          {"version":"$VERSION","productName":"Orlis Play Beta","identifier":"com.orlisplay.client.beta",
           "bundle":{"createUpdaterArtifacts":$signed},
           "plugins":{"updater":{"endpoints":["https://github.com/dpatel304/hello-world/releases/download/beta/latest.json"]}}}
          JSON
            echo "TAG=beta" >> $GITHUB_ENV
            echo "TITLE=Orlis Play Beta" >> $GITHUB_ENV
            echo "LABEL=$SHOWN Beta, build $BUILD" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "SETUP=Orlis-Play-Beta-Setup.exe" >> $GITHUB_ENV
          fi
          cat client/release.json

      # The beta is one release that's refilled each time: its update file
      # always describes the newest beta, at the same address.
      - name: Clear the last beta
        if: env.CHANNEL != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes --cleanup-tag 2>/dev/null || true

      - name: Build the app and publish it
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: astra-park
          tauriScript: npx tauri
          args: --config client/release.json
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TITLE }}
          releaseBody: Orlis Play ${{ env.LABEL }}, for Windows. Download ${{ env.SETUP }} below and double-click it.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: ${{ env.PRERELEASE }}
          includeUpdaterJson: true

      - name: The installer under the name that never changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls client/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" "$SETUP"
          gh release upload "$TAG" "$SETUP" --clobber

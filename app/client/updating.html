<!doctype html>
<!-- The small window Orlis Play shows while it installs an update at
     start-up: the cube, the words, and how far along it is (the app calls
     progress(0..1) as the download comes in). Copied into client/dist by
     build-web.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orlis Play</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #f3f4f7; color: #16161d; user-select: none; cursor: default;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  .cube { width: 84px; height: 92px; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(124, 92, 252, .28)); }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .bar { width: 220px; height: 6px; border-radius: 99px; background: #e3e5ec; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 4%; border-radius: 99px; background: linear-gradient(90deg, #2bb6c9, #5b8cf5, #a66bf5); transition: width .25s ease; }
</style>
</head>
<body>
  <svg class="cube" viewBox="-1 -1.1 2 2.2" aria-hidden="true"><defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9fbff"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
    <path d="M-.866 -.5 L0 0 L0 1 L-.866 .5Z" fill="url(#l)"/><path d="M0 0 L.866 -.5 L.866 .5 L0 1Z" fill="url(#r)"/><path d="M-.866 -.5 L0 -1 L.866 -.5 L0 0Z" fill="url(#t)"/>
  </svg>
  <h1>Updating — back in a moment</h1>
  <div class="bar"><i id="fill"></i></div>
  <script>
    window.progress = (k) => { document.getElementById('fill').style.width = Math.max(4, Math.min(100, k * 100)) + '%'; };
  </script>
</body>
</html>

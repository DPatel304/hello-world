# Builds the Orlis Play Windows app, in two channels.
#
#   Orlis Play Beta - every push that changes the game or the app. For trying
#     things out: its own app beside the normal one, with its own icon and
#     saves, and it updates itself to each new build.
#       https://github.com/dpatel304/orlis-play/releases/download/beta/Orlis-Play-Beta-Setup.exe
#
#   Orlis Play - only when released: run this workflow by hand (Actions >
#     Orlis Play for Windows > Run workflow) with channel "release". Everyone
#     with the normal app gets it on their next start.
#       https://github.com/dpatel304/orlis-play/releases/latest/download/Orlis-Play-Setup.exe
#
# Versions: astra-park/client/VERSION holds the one people see - 0.1 until
# a milestone, then 0.2 ... and 1.0 at launch - and only changes by hand.
# Each build adds its build number (this workflow's run number) behind it,
# 0.1.<build>, so every build is newer than the last for the updater. In the
# app: "0.1 Beta - build 27" on the beta, "0.1" on the release.
#
# Updates are signed. Add the private signing key as the repository secret
# TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions).
# Until it's there, installers still build, but installed copies can't
# update themselves from them.
name: Orlis Play for Windows

on:
  push:
    branches: [main]
    paths:
      - 'astra-park/src/**'
      - 'astra-park/client/**'
      - 'astra-park/index.html'
      - 'astra-park/package.json'
      - 'astra-park/package-lock.json'
      - 'astra-park/fetch-assets.mjs'
      - '.github/workflows/orlis-play-windows.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta (try it out) or release (everyone with Orlis Play gets it)'
        type: choice
        options: [beta, release]
        default: beta

permissions:
  contents: write

concurrency:
  group: orlis-play-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: astra-park
    env:
      BUILD: ${{ github.run_number }}
      CHANNEL: ${{ inputs.channel || 'beta' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astra-park/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: astra-park/client/src-tauri -> target

      - name: Install
        run: npm ci

      - name: Build the game files the app carries
        run: npm run client:web

      - name: The channel's name, version and update address
        shell: bash
        run: |
          SHOWN=$(tr -d ' \r\n' < client/VERSION)
          if ! [[ "$SHOWN" =~ ^[0-9]+\.[0-9]+$ ]]; then echo "::error::client/VERSION should be like 0.1 or 1.0, not '$SHOWN'"; exit 1; fi
          VERSION="$SHOWN.$BUILD"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHOWN=$SHOWN" >> $GITHUB_ENV
          signed=true
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            signed=false
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without self-updates."
          fi
          if [ "$CHANNEL" = "release" ]; then
            echo "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":$signed}}" > client/release.json
            echo "TAG=orlis-play-v$VERSION" >> $GITHUB_ENV
            echo "TITLE=Orlis Play $SHOWN" >> $GITHUB_ENV
            echo "LABEL=$SHOWN (build $BUILD)" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
            echo "SETUP=Orlis-Play-Setup.exe" >> $GITHUB_ENV
          else
            cat > client/release.json <<JSON
          {"version":"$VERSION","productName":"Orlis Play Beta","identifier":"com.orlisplay.client.beta",
           "bundle":{"createUpdaterArtifacts":$signed},
           "plugins":{"updater":{"endpoints":["https://github.com/dpatel304/orlis-play/releases/download/beta/latest.json"]}}}
          JSON
            echo "TAG=beta" >> $GITHUB_ENV
            echo "TITLE=Orlis Play Beta" >> $GITHUB_ENV
            echo "LABEL=$SHOWN Beta, build $BUILD" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "SETUP=Orlis-Play-Beta-Setup.exe" >> $GITHUB_ENV
          fi
          cat client/release.json

      # The release: a new GitHub release for each version.
      - name: Build the app and publish it (release)
        if: env.CHANNEL == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: astra-park
          tauriScript: npx tauri
          args: --config client/release.json
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TITLE }}
          releaseBody: Orlis Play ${{ env.LABEL }}, for Windows. Download ${{ env.SETUP }} below and double-click it.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: The installer under the name that never changes (release)
        if: env.CHANNEL == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls client/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" "$SETUP"
          gh release upload "$TAG" "$SETUP" --clobber

      # The beta: one release, refilled each time, so its update file is
      # always at the same address and describes the newest beta. The old
      # one stays up while the new one builds (that's ten minutes or so) and
      # is swapped out only once the new one is ready - the update file last
      # - so checking for updates works the whole time.
      - name: Build the app (beta)
        if: env.CHANNEL != 'release'
        shell: bash
        run: npx tauri build --config client/release.json

      - name: Swap the new beta in
        if: env.CHANNEL != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls client/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" "$SETUP"
          # (the update's own copy, named for its version, so an app that read
          #  the last update file mid-swap still gets the file it describes)
          UPD="Orlis-Play-Beta_${VERSION}_x64-setup.exe"
          cp "$exe" "$UPD"
          NOTES="Orlis Play $LABEL, for Windows. Download $SETUP below and double-click it."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$UPD" "$SETUP" --clobber
          if [ -f "$exe.sig" ]; then
            node -e '
              const fs = require("fs"), [sig, version, notes, url] = process.argv.slice(1);
              fs.writeFileSync("latest.json", JSON.stringify({ version, notes, pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": { signature: fs.readFileSync(sig, "utf8").trim(), url } } }, null, 2));
            ' "$exe.sig" "$VERSION" "$NOTES" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$UPD"
            cat latest.json
            gh release upload "$TAG" latest.json --clobber
          fi
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null || true
          # older betas' update copies, no longer pointed at
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '_x64-setup\.exe(\.sig)?$' | grep -vx "$UPD" | while read -r old; do
            gh release delete-asset "$TAG" "$old" --yes || true
          done || true   # (none to clear is fine)

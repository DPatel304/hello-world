name: build

on:
  push:
    branches: [master, main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: stomp

jobs:
  test:
    name: test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stomp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      # The suite launches the real Electron binary with a generated .y4m file
      # standing in for a webcam, so it needs a display to launch into.
      - run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm test

  windows:
    name: build for windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stomp/package-lock.json
      - run: npm ci
      # Runs on Windows, so the NSIS installer builds for real - no wine, and
      # the result is the thing that ends up on the laptop.
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Stomp-windows
          path: |
            stomp/dist/*.exe
            stomp/dist/*.zip
          if-no-files-found: error

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Miner</title>
<style>
  :root {
    --bg:#f7f7f5; --card:#ffffff; --line:#ebeae6; --fg:#16161a; --muted:#8a8a93; --soft:#f1f0ec;
    --accent:#f7931a; --accent-d:#dc7d0c; --good:#16a34a; --bad:#dc2626;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0e0f12; --card:#16181d; --line:#262932; --fg:#ececf1; --muted:#8b8e99; --soft:#1d2027;
      --good:#22c55e; --bad:#ef4444; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
  }
  :root[data-theme="dark"] { --bg:#0e0f12; --card:#16181d; --line:#262932; --fg:#ececf1; --muted:#8b8e99; --soft:#1d2027;
    --good:#22c55e; --bad:#ef4444; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
         font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:10px;
           padding:8px 14px; transition:background .15s, border-color .15s, transform .08s, opacity .15s; }
  button:hover:not(:disabled) { border-color:var(--muted); }
  button:active:not(:disabled) { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }

  /* reveal system: nothing shows until the game unlocks it */
  [data-reveal]:not(.shown) { display:none !important; }
  .shown { animation:rise .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  /* hero */
  #hero { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 16px 24px; transition:min-height .6s; }
  body.fresh #hero { min-height:100vh; padding-top:16px; }
  #balance { text-align:center; margin-bottom:20px; }
  #bBtc { font-size:44px; font-weight:700; letter-spacing:-1px; }
  #balance .unit { font-size:20px; color:var(--muted); font-weight:600; }
  #bUsd { color:var(--muted); font-size:15px; }
  #coinWrap { position:relative; width:220px; height:220px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  #ring { position:absolute; inset:0; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:3; }
  #ring .track { stroke:var(--line); }
  #ring .prog { stroke:var(--accent); stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; transition:stroke-dashoffset .12s linear; }
  #ring.fast .prog { stroke-dashoffset:0 !important; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #press { position:absolute; inset:18px; transition:transform .08s; }
  #coinWrap:active #press { transform:scale(.95); }
  #coin { width:100%; height:100%; display:block; filter:drop-shadow(0 14px 18px rgba(170,95,0,.28)); }
  #coin.flip { animation:flip .7s cubic-bezier(.3,.7,.3,1); }
  @keyframes flip { from { transform:perspective(600px) rotateY(0); } to { transform:perspective(600px) rotateY(360deg); } }
  .float { position:absolute; left:50%; top:30%; font-weight:700; color:var(--accent-d); pointer-events:none; white-space:nowrap;
           animation:floatUp 1.3s ease-out forwards; }
  @keyframes floatUp { from { opacity:0; transform:translate(-50%, 10px); } 15% { opacity:1; } to { opacity:0; transform:translate(-50%, -70px); } }
  #mine { margin-top:28px; background:var(--accent); color:#fff; border:0; border-radius:999px; font-size:18px; font-weight:600;
          padding:14px 64px; box-shadow:0 6px 18px rgba(247,147,26,.35); letter-spacing:.3px; }
  #mine:hover { background:var(--accent-d); }
  #next { margin-top:12px; color:var(--muted); font-size:13px; height:18px; }
  #stats { display:flex; gap:28px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
  .stat { text-align:center; }
  .stat small { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .stat b { font-size:17px; font-weight:600; }

  /* cards */
  #grid { max-width:1240px; margin:0 auto; padding:8px 16px 64px; display:flex; flex-wrap:wrap; justify-content:center; gap:16px; align-items:flex-start; }
  #grid > .card { flex:1 1 300px; max-width:380px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); min-width:0; }
  .card-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .card h3 { margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:600; }
  .pill { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--soft); }
  .up { color:var(--good); } .down { color:var(--bad); }
  #price { font-size:30px; font-weight:700; letter-spacing:-.5px; }
  .sub { color:var(--muted); font-size:13px; }
  #chart { width:100%; height:110px; display:block; margin:12px 0 4px; }
  .btns { display:flex; gap:8px; margin-top:14px; }
  .btns button { flex:1; }
  .seg { display:flex; background:var(--soft); border-radius:10px; padding:3px; gap:2px; }
  .seg button { flex:1; white-space:nowrap; border:0; background:transparent; padding:6px 8px; font-size:13px; border-radius:8px; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .auto { margin-top:12px; display:flex; align-items:center; gap:10px; }
  .auto > span { font-size:13px; color:var(--muted); white-space:nowrap; }
  .auto .seg { flex:1; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .nm { min-width:0; }
  .row .nm b { font-weight:600; }
  .row .nm .cnt { color:var(--accent-d); font-weight:600; margin-left:4px; }
  .row .nm small { display:block; color:var(--muted); font-size:12px; }
  .row button { min-width:96px; font-weight:600; font-size:14px; }
  .qty { margin-bottom:6px; width:160px; }
  .kv { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
  .kv span:first-child { color:var(--muted); }
  .bar { height:8px; border-radius:99px; background:var(--soft); overflow:hidden; margin:8px 0 12px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .4s; }
  #news { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); min-height:20px; }
  .brown { color:var(--bad); }

  /* chrome */
  #ctl { position:fixed; top:14px; right:14px; display:flex; gap:6px; z-index:5; }
  #ctl button { padding:6px 10px; font-size:12px; border-radius:999px; background:var(--card); color:var(--muted); }
  #ctl button.on { color:var(--fg); }
  #toasts { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; z-index:6; pointer-events:none; width:calc(100% - 32px); }
  .toast { background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.18);
           animation:toast 4s ease forwards; max-width:440px; text-align:center; }
  .toast.big { background:var(--accent); color:#fff; font-weight:600; }
  .toast.good { background:var(--good); color:#fff; } .toast.bad { background:var(--bad); color:#fff; }
  @keyframes toast { 0% { opacity:0; transform:translateY(8px); } 8%, 85% { opacity:1; transform:none; } 100% { opacity:0; } }
  #end { position:fixed; inset:0; background:rgba(10,10,12,.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #end .card { max-width:420px; width:100%; text-align:center; padding:32px 28px; }
  #end h2 { margin:12px 0 4px; font-size:26px; letter-spacing:-.5px; }
  #end .kv { text-align:left; }
  #foot { text-align:center; padding:0 16px 40px; }
  #foot button { border:0; background:none; color:var(--muted); font-size:13px; }
  @media (max-width:420px) { #bBtc { font-size:36px; } #coinWrap { width:190px; height:190px; } #stats { gap:18px; } }
</style>
</head>
<body class="fresh">
<div id="ctl" data-reveal="started"><button id="sndBtn" class="on">Sound</button><button id="musBtn" class="on">Music</button></div>

<section id="hero">
  <div id="balance" data-reveal="wallet">
    <div><span id="bBtc">0</span> <span class="unit">BTC</span></div>
    <div id="bUsd">$0.00 cash</div>
  </div>
  <div id="coinWrap" title="Mine">
    <svg id="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="48"/><circle class="prog" cx="50" cy="50" r="48" pathLength="100"/></svg>
    <div id="press">
      <svg id="coin" viewBox="0 0 200 200" aria-label="Bitcoin">
        <defs>
          <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd884"/><stop offset=".5" stop-color="#e9a131"/><stop offset="1" stop-color="#9e5406"/></linearGradient>
          <radialGradient id="face" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe7a1"/><stop offset=".42" stop-color="#f7b43c"/><stop offset="1" stop-color="#c8700c"/></radialGradient>
          <linearGradient id="lip" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe1a0"/><stop offset="1" stop-color="#a95c07"/></linearGradient>
          <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <circle cx="100" cy="100" r="98" fill="url(#edge)"/>
        <circle cx="100" cy="100" r="94" fill="none" stroke="#b5650b" stroke-opacity=".55" stroke-width="5" stroke-dasharray="1.6 2.1"/>
        <circle cx="100" cy="100" r="88" fill="url(#lip)"/>
        <circle cx="100" cy="100" r="84" fill="url(#face)"/>
        <circle cx="100" cy="100" r="74" fill="none" stroke="#c97a14" stroke-opacity=".5" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="72.5" fill="none" stroke="#ffe3a3" stroke-opacity=".6" stroke-width="1"/>
        <g transform="rotate(14 100 100)" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="104" text-anchor="middle">
          <g fill="#ffe8ad"><rect x="83.5" y="38.5" width="8" height="18" rx="2"/><rect x="103.5" y="38.5" width="8" height="18" rx="2"/>
            <rect x="83.5" y="141.5" width="8" height="18" rx="2"/><rect x="103.5" y="141.5" width="8" height="18" rx="2"/>
            <text x="99.5" y="136.5">B</text></g>
          <g fill="#b9650a"><rect x="85" y="40" width="8" height="18" rx="2"/><rect x="105" y="40" width="8" height="18" rx="2"/>
            <rect x="85" y="143" width="8" height="18" rx="2"/><rect x="105" y="143" width="8" height="18" rx="2"/>
            <text x="101" y="138">B</text></g>
        </g>
        <path d="M30 78 A74 74 0 0 1 112 27 A90 90 0 0 0 40 95 Z" fill="url(#sheen)"/>
      </svg>
    </div>
  </div>
  <button id="mine">Mine</button>
  <div id="next"></div>
  <div id="stats" data-reveal="stats">
    <div class="stat"><small>Hashrate</small><b id="sHash">0</b></div>
    <div class="stat"><small>Blocks / s</small><b id="sBps">0</b></div>
    <div class="stat"><small>Power</small><b id="sPow">0</b></div>
    <div class="stat"><small>Power cost</small><b id="sCost">$0/s</b></div>
  </div>
</section>

<section id="grid">
  <div class="card" data-reveal="wallet">
    <div class="card-h"><h3>Market</h3><span class="pill" id="chg"></span></div>
    <div id="price">$0.05</div><div class="sub">per bitcoin</div>
    <canvas id="chart" data-reveal="network"></canvas>
    <div class="btns"><button id="sellAll" class="primary">Sell all</button><button id="sellHalf">Sell half</button></div>
    <div class="auto" data-reveal="autosell"><span>Auto-sell</span>
      <div class="seg" id="autoSeg"><button data-m="0">Off</button><button data-m="1">Always</button><button data-m="2" id="highsBtn">On highs</button></div></div>
  </div>
  <div class="card" data-reveal="hardware">
    <div class="card-h"><h3>Hardware</h3>
      <div class="seg qty" id="qtySeg"><button data-q="1" class="on">×1</button><button data-q="10">×10</button><button data-q="max">Max</button></div></div>
    <div id="tiers"></div>
  </div>
  <div class="card" data-reveal="upgrades">
    <div class="card-h"><h3>Upgrades</h3></div>
    <div id="ups"></div>
  </div>
  <div class="card" data-reveal="network">
    <div class="card-h"><h3>Network</h3><span class="pill" id="epPill"></span></div>
    <div class="kv"><span>Mined supply</span><span id="supTxt"></span></div>
    <div class="bar"><i id="supBar"></i></div>
    <div class="kv"><span>Block height</span><span id="nHeight"></span></div>
    <div class="kv"><span>Block reward</span><span id="nReward"></span></div>
    <div class="kv"><span id="nHalvLbl">Next halving</span><span id="nHalv"></span></div>
    <div class="kv"><span>Difficulty</span><span id="nDiff"></span></div>
    <div id="news"></div>
  </div>
</section>
<div id="foot" data-reveal="hardware"><button id="resetBtn">Reset progress</button></div>
<div id="toasts"></div>
<div id="end" class="hidden" style="display:none"></div>

<script>
"use strict";
//#CORE-START
const CFG = { CAP:21e6, EP:10500, EPOCHS:10, R0:1000, D0:20, K:1.38e-4, P0:0.05, G:1.38e-4, BPS:20, RT:0.8, ER0:0.004, EG:9e-5, GROW:1.12, MK:0 };

const TIERS = [
  { id:"cpu",  name:"CPU Miner",       cost:10,     hash:1,      watts:65 },
  { id:"gpu",  name:"GPU Rig",         cost:100,    hash:15,     watts:300 },
  { id:"fpga", name:"FPGA Board",      cost:1100,   hash:220,    watts:900 },
  { id:"asic", name:"ASIC Miner",      cost:1.2e4,  hash:3200,   watts:1800 },
  { id:"rack", name:"ASIC Rack",       cost:1.4e5,  hash:4.6e4,  watts:9000 },
  { id:"cont", name:"Mining Container",cost:1.6e6,  hash:6.6e5,  watts:6e4 },
  { id:"dc",   name:"Data Center",     cost:9e6,    hash:9.5e6,  watts:5e5 },
  { id:"farm", name:"Mega Farm",       cost:7e7,    hash:1.4e8,  watts:4e6 },
  { id:"fus",  name:"Fusion Reactor",  cost:3e8,    hash:2e9,      watts:3e7 },
];

// hm: hashrate x, em: electricity price x, wm: watts x, cm: click power x
const UPS = [
  { id:"autosell", name:"Auto-Sell Bot",        desc:"Sells mined BTC for you.",         cost:60 },
  { id:"mouse",    name:"Gaming Mouse",         desc:"Clicks x3.",                       cost:40,    cm:3 },
  { id:"oc",       name:"Overclocking",         desc:"Hashrate x1.25, power +15%.",      cost:250,   hm:1.25, wm:1.15 },
  { id:"offpeak",  name:"Off-Peak Power Deal",  desc:"Electricity -25%.",                cost:600,   em:0.75 },
  { id:"macro",    name:"Click Macro",          desc:"Clicks x5.",                       cost:1500,  cm:5 },
  { id:"diamond",  name:"Diamond Hands",        desc:"Unlocks 'sell on highs' mode.",    cost:4000 },
  { id:"firm",     name:"Custom Firmware",      desc:"Hashrate x1.3.",                   cost:8000,  hm:1.3 },
  { id:"hydro",    name:"Hydro Power Contract", desc:"Electricity -35%.",                cost:5e4,   em:0.65 },
  { id:"immerse",  name:"Immersion Cooling",    desc:"Hashrate x1.5, power -10%.",       cost:2e5,   hm:1.5, wm:0.9 },
  { id:"solar",    name:"Solar Farm",           desc:"Electricity -40%.",                cost:2e6,   em:0.6 },
  { id:"chip",     name:"Next-Gen Chip Design", desc:"Hashrate x1.6.",                   cost:1.5e7,   hm:1.6 },
  { id:"nuke",     name:"Private Reactor",      desc:"Electricity -50%.",                cost:8e7,   em:0.5 },
  { id:"litho",    name:"3nm Lithography",      desc:"Hashrate x2.",                     cost:5e8,   hm:2 },
  { id:"fusion",   name:"Fusion Grid",          desc:"Electricity -50%.",                cost:4e9,  em:0.5 },
  { id:"ai",       name:"AI Scheduler",         desc:"Hashrate x1.5.",                   cost:2e10,  hm:1.5 },
];

const randn = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*Math.random()); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const H = { block(){}, halving(){}, final(){}, event(){}, sell(){} };   // UI hooks

function newState() {
  return { usd:0, btc:0, mined:0, height:0, work:0, target:0, lm:0, hw:TIERS.map(() => 0), ups:{},
           clicks:0, time:0, blocks:0, earned:0, auto:0, done:false, brown:false, evT:45, sold:0 };
}
let S = newState();
S.target = 0;

const epoch   = () => Math.min(CFG.EPOCHS-1, Math.floor(S.height / CFG.EP));
const reward  = () => CFG.R0 / Math.pow(2, epoch());
// base difficulty climbs with height; when your hashrate outruns it, it retargets (diminishing returns)
const baseDiff = () => CFG.D0 * Math.exp(CFG.K * S.height);
function diff() {
  const b = baseDiff(), x = hashrate() / (b * CFG.BPS);
  return x > 1 ? b * Math.pow(x, CFG.RT) : b;
}
const basePrice = () => CFG.P0 * Math.exp(CFG.G * S.height);
const price   = () => basePrice() * Math.exp(S.lm);
const mkt     = () => Math.pow(basePrice() / CFG.P0, CFG.MK);          // hardware costs track the market
function mult(k) { let m = 1; for (const u of UPS) if (S.ups[u.id] && u[k]) m *= u[k]; return m; }
const upCost  = u => Math.ceil(u.cost * mkt());
const costN   = (i, n) => Math.ceil(TIERS[i].cost * mkt() * Math.pow(CFG.GROW, S.hw[i]) * (Math.pow(CFG.GROW, n) - 1) / (CFG.GROW - 1));
function maxAff(i) {
  const base = TIERS[i].cost * mkt() * Math.pow(CFG.GROW, S.hw[i]);
  return Math.max(0, Math.floor(Math.log(1 + S.usd * (CFG.GROW - 1) / base) / Math.log(CFG.GROW)));
}
const hashrate  = () => { let h = 0; for (let i = 0; i < TIERS.length; i++) h += S.hw[i] * TIERS[i].hash; return h * mult("hm") * (S.brown ? 0.2 : 1); };
const clickPow  = () => mult("cm");
const watts     = () => { let w = 0; for (let i = 0; i < TIERS.length; i++) w += S.hw[i] * TIERS[i].watts; return w * mult("wm") * (S.brown ? 0.2 : 1); };
// electricity tracks mining revenue per hash, drifting up over time: $ per watt-second
const elecRate  = () => CFG.ER0 * (reward() * basePrice() / baseDiff()) / (CFG.R0 * CFG.P0 / CFG.D0) * Math.exp(CFG.EG * S.height) * mult("em");
const luck      = () => clamp(-Math.log(1 - Math.random()), 0.35, 2.2);

function sell(frac = 1) {
  const b = S.btc * frac; if (b <= 0) return 0;
  const usd = b * price(); S.btc -= b; S.usd += usd; S.earned += usd; H.sell(usd, b); return usd;
}
function buyTier(i, qty) {
  const n = qty === "max" ? maxAff(i) : qty;
  if (n < 1) return false;
  const c = costN(i, n); if (c > S.usd) return false;
  S.usd -= c; S.hw[i] += n; return true;
}
function buyUp(id) {
  const u = UPS.find(x => x.id === id); if (!u || S.ups[id]) return false;
  const c = upCost(u); if (c > S.usd) return false;
  S.usd -= c; S.ups[id] = true;
  if (id === "autosell") S.auto = 1;
  return true;
}

function found(n) {
  const r = reward() * n;
  S.btc += r; S.mined += r; S.height += n; S.blocks += n;
  if (S.height >= CFG.EP * CFG.EPOCHS) {
    const rest = CFG.CAP - S.mined; S.btc += rest; S.mined = CFG.CAP; S.done = true; H.block(1, rest); H.final(); return;
  }
  H.block(n, r);
  if (S.height % CFG.EP === 0) { S.lm = clamp(S.lm + 0.25, -1.5, 1.2); H.halving(epoch()); }
}
function mine() {
  if (!S.target) S.target = diff() * luck();
  let guard = 0;
  while (S.work >= S.target && !S.done && guard++ < 300) {
    const D = diff(), avail = Math.floor(S.work / D);
    if (avail > 8) {
      const n = Math.min(avail, (epoch() + 1) * CFG.EP - S.height);
      S.work -= n * D; found(Math.max(1, n));
    } else { S.work -= S.target; found(1); }
    S.target = diff() * luck();
  }
}
function click() { if (S.done) return; S.work += clickPow(); S.clicks++; mine(); }

function step(dt) {
  if (S.done) return;
  S.time += dt;
  S.lm = clamp(S.lm + (-0.04 * S.lm) * dt + 0.035 * Math.sqrt(dt) * randn(), -1.5, 1.2);
  S.evT -= dt;
  if (S.evT <= 0) {
    S.evT = 40 + Math.random() * 60;
    const r = Math.random();
    if (r < 0.35)      { S.lm = clamp(S.lm + 0.35 + Math.random() * 0.3, -1.5, 1.2); H.event("pump", Math.random()); }
    else if (r < 0.7)  { S.lm = clamp(S.lm - 0.4 - Math.random() * 0.3, -1.5, 1.2); H.event("crash", Math.random()); }
    else               { S.lm = clamp(S.lm + randn() * 0.05, -1.5, 1.2); H.event("news", Math.random()); }
  }
  const pc = watts() * elecRate() * dt;
  if (S.auto === 1 || (S.auto === 2 && S.lm > 0.08) || (S.btc > 0 && S.usd < pc * 5)) sell(1);
  if (S.usd >= pc) { S.usd -= pc; S.brown = false; } else { S.usd = 0; S.brown = true; }
  S.work += hashrate() * dt;
  mine();
}
function resetGame() { S = newState(); }
//#CORE-END

// ================= UI =================
const $ = id => document.getElementById(id);
const SAVE_KEY = "blockminer2009";
const U = { qty:1, bps:0, lastBlocks:0, hist:[], upKey:"", lastFloat:0, lastFlip:0, lastReveal:0 };

function fmtN(n) {
  if (!isFinite(n)) return "0";
  if (Math.abs(n) < 1000) return n.toFixed(Math.abs(n) < 10 ? 2 : Math.abs(n) < 100 ? 1 : 0);
  const u = ["K","M","B","T","Qa","Qi","Sx"]; let i = -1;
  while (Math.abs(n) >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(2) + u[i];
}
const fmtUsd = n => "$" + (Math.abs(n) < 1000 ? n.toFixed(2) : fmtN(n));
const fmtBtc = n => n <= 0 ? "0" : n < 1000 ? n.toFixed(n < 10 ? 4 : 2) : Math.floor(n).toLocaleString("en-US");
function fmtUnit(n, us) { let i = 0; while (n >= 1000 && i < us.length - 1) { n /= 1000; i++; } return (n < 10 && i ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + " " + us[i]; }
const fmtH = n => fmtUnit(n, ["H/s","kH/s","MH/s","GH/s","TH/s","PH/s","EH/s","ZH/s"]);
const fmtW = n => fmtUnit(n, ["W","kW","MW","GW","TW"]);

function toast(msg, kind = "") {
  const box = $("toasts"), t = document.createElement("div");
  t.className = "toast " + kind; t.textContent = msg; box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 4000);
}
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ================= PROGRESSIVE REVEAL =================
const totalHw = () => S.hw.reduce((a, b) => a + b, 0);
const STAGES = [
  ["started",  () => S.clicks > 0],
  ["wallet",   () => S.blocks > 0,          "You found a block! Sell your bitcoin for cash."],
  ["hardware", () => S.earned > 0,          "Hardware unlocked. Let machines mine for you."],
  ["stats",    () => totalHw() > 0],
  ["upgrades", () => totalHw() > 0 && S.earned >= 40,        "Upgrades unlocked."],
  ["autosell", () => !!S.ups.autosell],
  ["network",  () => S.blocks >= 40,        "Network stats unlocked. Watch for the halving."],
];
function checkReveal() {
  S.seen = S.seen || {};
  // unlock one panel at a time, a beat apart, so the page grows calmly
  const now = performance.now();
  for (const [k, cond, msg] of STAGES) {
    if (S.seen[k] || !cond()) continue;
    if (msg && now - U.lastReveal < 1800) break;
    S.seen[k] = true; if (msg) { toast(msg); U.lastReveal = now; break; }
  }
  document.querySelectorAll("[data-reveal]").forEach(el => el.classList.toggle("shown", !!S.seen[el.dataset.reveal]));
  document.body.classList.toggle("fresh", !S.seen.wallet);
}

// ================= AUDIO (all synthesized, kept soft) =================
const A = { ctx:null, snd:true, mus:true };
function audioInit() {
  if (A.ctx) { if (A.ctx.state !== "running") A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const c = A.ctx = new AC();
  A.master = c.createGain(); A.master.gain.value = 0.55; A.master.connect(c.destination);
  A.sfx = c.createGain(); A.sfx.connect(A.master);
  A.mg = c.createGain(); A.mg.connect(A.master);
  // machine hum: low detuned sines + a breath of filtered noise for fans; scales with hashrate
  A.humG = c.createGain(); A.humG.gain.value = 0; A.humG.connect(A.master);
  A.o1 = c.createOscillator(); A.o1.type = "sine"; A.o1.frequency.value = 55; A.o1.connect(A.humG); A.o1.start();
  A.o2 = c.createOscillator(); A.o2.type = "triangle"; A.o2.frequency.value = 110.4; A.o2.connect(A.humG); A.o2.start();
  const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  A.noise = c.createBufferSource(); A.noise.buffer = buf; A.noise.loop = true;
  A.nF = c.createBiquadFilter(); A.nF.type = "lowpass"; A.nF.frequency.value = 500;
  A.nG = c.createGain(); A.nG.gain.value = 0; A.noise.connect(A.nF); A.nF.connect(A.nG); A.nG.connect(A.master); A.noise.start();
  applyAudio();
  setInterval(musicStep, 420);
}
function applyAudio() {
  $("sndBtn").classList.toggle("on", A.snd); $("sndBtn").textContent = A.snd ? "Sound on" : "Sound off";
  $("musBtn").classList.toggle("on", A.mus); $("musBtn").textContent = A.mus ? "Music on" : "Music off";
  if (!A.ctx) return;
  A.sfx.gain.value = A.snd ? 1 : 0; A.mg.gain.value = A.mus ? 1 : 0;
}
function tone(f, dur, type = "sine", vol = 0.08, slide = 0, delay = 0, out) {
  if (!A.ctx || A.ctx.state !== "running") return;
  const c = A.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out || A.sfx); o.start(t); o.stop(t + dur + 0.02);
}
let lastChime = 0;
const SFX = {
  click: () => tone(520 + Math.random() * 80, 0.07, "sine", 0.07, -120),
  block: () => { const n = performance.now(); if (n - lastChime < 180) return; lastChime = n;
                 tone(1318.5, 0.35, "sine", 0.07); tone(1975.5, 0.5, "sine", 0.05, 0, 0.07); },
  buy:   () => { tone(660, 0.1, "sine", 0.06); tone(880, 0.14, "sine", 0.06, 0, 0.06); },
  sell:  () => { tone(1568, 0.08, "triangle", 0.05); tone(2093, 0.18, "triangle", 0.05, 0, 0.06); },
  err:   () => tone(180, 0.15, "sine", 0.07, -40),
  pump:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, "sine", 0.05, 0, i * 0.08)),
  crash: () => { tone(392, 0.8, "triangle", 0.07, -250); tone(196, 0.9, "sine", 0.06, -100, 0.1); },
  halving: () => { tone(65.4, 2.8, "sine", 0.25); [392, 523, 659, 784].forEach((f, i) => tone(f, 1.2, "sine", 0.05, 0, 0.25 + i * 0.16)); },
  final: () => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 2, "sine", 0.06, 0, i * 0.2)); tone(65.4, 4, "sine", 0.22); },
};
// ambient music: slow pentatonic plucks, a little brighter each epoch
const SCALE = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
const PATS = [[0,2,4,2,5,4,2,1],[0,4,5,7,5,4,2,4],[2,4,6,4,7,6,4,5],[0,2,4,7,6,4,2,1]];
let mStep = 0;
function musicStep() {
  if (!A.ctx || !A.mus || S.done || !S.seen.wallet) return;
  const e = epoch(), k = mStep++, pat = PATS[(Math.floor(k / 32) + e) % PATS.length];
  tone(SCALE[pat[k % 8]] * (e >= 5 ? 2 : 1), 0.6, "sine", 0.028, 0, 0, A.mg);
  if (k % 8 === 0) tone(SCALE[pat[0]] / 2, 2.4, "triangle", 0.03, 0, 0, A.mg);
}
function updateHum() {
  if (!A.ctx) return;
  const h = hashrate(), lvl = clamp(Math.log10(h + 1) / 10, 0, 1), t = A.ctx.currentTime, on = A.snd && h > 0 && !S.done ? 1 : 0;
  A.humG.gain.setTargetAtTime(on * (0.012 + 0.03 * lvl), t, 0.6);
  A.nG.gain.setTargetAtTime(on * (0.003 + 0.016 * lvl), t, 0.6);
  A.o1.frequency.setTargetAtTime(50 + 25 * lvl, t, 1); A.o2.frequency.setTargetAtTime(100.4 + 50 * lvl, t, 1);
  A.nF.frequency.setTargetAtTime(400 + 1400 * lvl, t, 1);
}

// ================= GAME HOOKS =================
const NEWS = {
  pump:  ["Pizza shop now accepts Bitcoin", "Celebrity tweets 'to the moon'", "Major exchange lists BTC", "A whale buys the dip", "Hedge fund adds BTC to its treasury", "ETF approved. Number go up."],
  crash: ["Exchange hacked, panic selling", "Government announces a crackdown", "FUD spreads on the forums", "A whale dumps its bag", "Mining ban rumored abroad", "Regulator calls it a bubble"],
  news:  ["New ASIC announced", "Forum asks: is mining still worth it?", "Electricity prices wobble", "Someone lost their keys in a landfill", "Laser eyes are trending", "Satoshi is still missing"],
};
H.block = (n, r) => {
  SFX.block();
  const now = performance.now();
  if (now - U.lastFlip > 900) { U.lastFlip = now; restart($("coin"), "flip"); }
  if (now - U.lastFloat > 700) {
    U.lastFloat = now;
    const f = document.createElement("div"); f.className = "float";
    f.textContent = "+" + (r >= 100 ? Math.round(r).toLocaleString("en-US") : r.toFixed(2)) + " BTC";
    f.style.marginLeft = (Math.random() * 60 - 30) + "px";
    $("coinWrap").appendChild(f); f.addEventListener("animationend", () => f.remove());
  }
};
H.halving = () => {
  SFX.halving();
  toast("Halving! Block reward is now " + fmtBtc(reward()) + " BTC", "big");
  U.hist.push({ p:price(), halv:true });
};
H.event = (type, r) => {
  const list = NEWS[type], msg = list[Math.floor(r * list.length)];
  $("news").innerHTML = `<span class="${type === "pump" ? "up" : type === "crash" ? "down" : ""}">${type === "pump" ? "▲" : type === "crash" ? "▼" : "•"}</span> ${msg}`;
  if (!S.seen || !S.seen.wallet) return;
  if (type === "pump") { SFX.pump(); toast("▲ " + msg, "good"); }
  if (type === "crash") { SFX.crash(); toast("▼ " + msg, "bad"); }
};
H.final = () => {
  SFX.final(); save();
  setTimeout(() => {
    const m = Math.floor(S.time / 60), s = Math.floor(S.time % 60), e = $("end");
    e.innerHTML = `<div class="card">
      <svg viewBox="0 0 200 200" width="88" height="88">${$("coin").innerHTML}</svg>
      <h2>All 21,000,000 mined</h2><p class="sub">The last bitcoin is yours. Satoshi would be proud.</p>
      <div class="kv"><span>Time</span><span>${m}m ${s}s</span></div>
      <div class="kv"><span>Blocks found</span><span>${S.blocks.toLocaleString()}</span></div>
      <div class="kv"><span>Final price</span><span>${fmtUsd(price())}</span></div>
      <div class="kv"><span>Cash earned</span><span>${fmtUsd(S.earned)}</span></div>
      <div class="kv"><span>Clicks</span><span>${S.clicks.toLocaleString()}</span></div>
      <button class="primary" id="againBtn" style="margin-top:18px;width:100%">Play again</button></div>`;
    e.style.display = "";
    $("againBtn").onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (err) {} location.reload(); };
  }, 1800);
};

// ================= CONTROLS =================
function doMine() { audioInit(); click(); SFX.click(); checkReveal(); renderUI(); }
$("mine").onclick = doMine;
$("mine").addEventListener("keyup", e => { if (e.code === "Space") e.preventDefault(); });
$("coinWrap").onclick = doMine;
document.addEventListener("keydown", e => {
  if (e.code === "Space" && (e.target === document.body || e.target === $("mine"))) { e.preventDefault(); if (!e.repeat) doMine(); }
});
document.addEventListener("pointerdown", audioInit);
$("sellAll").onclick = () => { if (sell(1) > 0) SFX.sell(); else SFX.err(); renderUI(); };
$("sellHalf").onclick = () => { if (sell(0.5) > 0) SFX.sell(); else SFX.err(); renderUI(); };
$("autoSeg").querySelectorAll("button").forEach(b => b.onclick = () => { S.auto = +b.dataset.m; SFX.buy(); renderUI(); });
$("qtySeg").querySelectorAll("button").forEach(b => b.onclick = () => {
  U.qty = b.dataset.q === "max" ? "max" : +b.dataset.q;
  $("qtySeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderUI();
});
$("sndBtn").onclick = () => { A.snd = !A.snd; applyAudio(); updateHum(); save(); };
$("musBtn").onclick = () => { A.mus = !A.mus; applyAudio(); save(); };
$("resetBtn").onclick = () => { if (confirm("Reset all progress and start over?")) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); } };

const tierRows = TIERS.map((t, i) => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div class="nm"><b>${t.name}</b><span class="cnt"></span><small></small></div><button></button>`;
  const btn = row.querySelector("button");
  btn.onclick = () => { const had = S.hw[i]; if (buyTier(i, U.qty)) { SFX.buy(); if (!had) toast(t.name + " online"); checkReveal(); renderUI(); } else SFX.err(); };
  $("tiers").appendChild(row);
  return { row, cnt:row.querySelector(".cnt"), info:row.querySelector("small"), btn };
});

function renderUps() {
  const list = UPS.filter(u => !S.ups[u.id]).slice(0, 4), key = list.map(u => u.id).join();
  if (key !== U.upKey) {
    U.upKey = key; const box = $("ups"); box.innerHTML = "";
    if (!list.length) box.innerHTML = '<div class="sub">Every upgrade purchased.</div>';
    for (const u of list) {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<div class="nm"><b>${u.name}</b><small>${u.desc}</small></div><button data-id="${u.id}"></button>`;
      row.querySelector("button").onclick = () => { if (buyUp(u.id)) { SFX.buy(); toast(u.name + " purchased"); checkReveal(); renderUI(); } else SFX.err(); };
      box.appendChild(row);
    }
  }
  $("ups").querySelectorAll("button[data-id]").forEach(b => {
    const c = upCost(UPS.find(x => x.id === b.dataset.id)); b.textContent = fmtUsd(c); b.disabled = c > S.usd;
  });
}

function renderUI() {
  const p = price(), h = hashrate();
  $("bBtc").textContent = fmtBtc(S.btc);
  $("bUsd").textContent = fmtUsd(S.usd) + " cash";
  // progress ring toward the next block
  const pct = Math.min(100, S.work / (S.target || 1) * 100), eta = h > 0 ? (S.target - S.work) / h : Infinity;
  $("ring").classList.toggle("fast", h > 0 && S.target / h < 0.4);
  const prog = $("ring").querySelector(".prog");
  prog.style.strokeDashoffset = 100 - pct; prog.style.opacity = pct < 1 ? 0 : 1;
  $("next").textContent = !S.seen.wallet ? "" : h <= 0 ? "Click the coin or press Mine" : eta < 1 ? "Mining…" : "Next block in ~" + Math.ceil(eta) + "s";
  if (S.seen.stats) {
    const w = watts();
    $("sHash").textContent = fmtH(h); $("sBps").textContent = U.bps.toFixed(U.bps < 10 ? 2 : 0);
    $("sPow").textContent = fmtW(w);
    $("sCost").textContent = S.brown ? "Brownout" : fmtUsd(w * elecRate()) + "/s";
    $("sCost").classList.toggle("brown", S.brown);
  }
  if (S.seen.wallet) {
    $("price").textContent = fmtUsd(p);
    const ref = U.hist.length > 30 ? U.hist[U.hist.length - 30].p : U.hist.length ? U.hist[0].p : p, ch = (p / ref - 1) * 100;
    $("chg").textContent = (ch >= 0 ? "▲ " : "▼ ") + Math.abs(ch).toFixed(1) + "%"; $("chg").className = "pill " + (ch >= 0 ? "up" : "down");
    $("sellAll").disabled = $("sellHalf").disabled = S.btc <= 0;
    $("highsBtn").style.display = S.ups.diamond ? "" : "none";
    $("autoSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.m === S.auto));
  }
  if (S.seen.hardware) TIERS.forEach((t, i) => {
    const r = tierRows[i], n = U.qty === "max" ? Math.max(1, maxAff(i)) : U.qty, c = costN(i, n);
    r.row.style.display = i === 0 || S.hw[i] > 0 || S.hw[i - 1] > 0 ? "" : "none";
    r.cnt.textContent = S.hw[i] ? "×" + S.hw[i] : "";
    r.info.textContent = `${fmtH(t.hash * mult("hm"))} · ${fmtW(t.watts * mult("wm"))}`;
    r.btn.textContent = (n > 1 ? n + " for " : "") + fmtUsd(c); r.btn.disabled = c > S.usd;
  });
  if (S.seen.upgrades) renderUps();
  if (S.seen.network) {
    const left = (epoch() + 1) * CFG.EP - S.height, last = epoch() === CFG.EPOCHS - 1;
    $("supTxt").textContent = (S.mined / CFG.CAP * 100).toFixed(2) + "% of 21M";
    $("supBar").style.width = (S.mined / CFG.CAP * 100) + "%";
    $("epPill").textContent = "Epoch " + (epoch() + 1) + " of " + CFG.EPOCHS;
    $("nHeight").textContent = S.height.toLocaleString();
    $("nReward").textContent = fmtBtc(reward()) + " BTC";
    $("nHalvLbl").textContent = last ? "Last bitcoin in" : "Next halving in";
    $("nHalv").textContent = left.toLocaleString() + " blocks";
    $("nDiff").textContent = fmtN(diff());
  }
}

// ================= CHART =================
function drawChart() {
  const cv = $("chart"); if (!S.seen.network) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hgt = cv.clientHeight; if (!w) return;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hgt);
  const d = U.hist; if (d.length < 2) return;
  const cs = getComputedStyle(document.documentElement), acc = cs.getPropertyValue("--accent").trim(), line = cs.getPropertyValue("--line").trim();
  let lo = Infinity, hi = -Infinity;
  for (const e of d) { const l = Math.log(e.p); lo = Math.min(lo, l); hi = Math.max(hi, l); }
  if (hi - lo < 0.1) { const m = (hi + lo) / 2; lo = m - 0.05; hi = m + 0.05; }
  const X = i => i / (d.length - 1) * w, Y = p => hgt - 6 - (Math.log(p) - lo) / (hi - lo) * (hgt - 14);
  c.strokeStyle = line; c.lineWidth = 1; c.setLineDash([3, 4]);
  d.forEach((e, i) => { if (e.halv) { c.beginPath(); c.moveTo(X(i), 0); c.lineTo(X(i), hgt); c.stroke(); } });
  c.setLineDash([]);
  c.beginPath(); d.forEach((e, i) => i ? c.lineTo(X(i), Y(e.p)) : c.moveTo(0, Y(e.p)));
  const g = c.createLinearGradient(0, 0, 0, hgt); g.addColorStop(0, acc + "40"); g.addColorStop(1, acc + "00");
  c.save(); c.lineTo(w, hgt); c.lineTo(0, hgt); c.closePath(); c.fillStyle = g; c.fill(); c.restore();
  c.beginPath(); d.forEach((e, i) => i ? c.lineTo(X(i), Y(e.p)) : c.moveTo(0, Y(e.p)));
  c.strokeStyle = acc; c.lineWidth = 2; c.lineJoin = "round"; c.stroke();
  const lx = X(d.length - 1), ly = Y(d[d.length - 1].p);
  c.beginPath(); c.arc(lx - 3, ly, 3, 0, Math.PI * 2); c.fillStyle = acc; c.fill();
}

// ================= LOOP / SAVE =================
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ S, snd:A.snd, mus:A.mus, hist:U.hist.slice(-150), at:Date.now() })); } catch (e) {}
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && d.S ? d : null; } catch (e) { return null; }
}
let wall = Date.now(), secAcc = 0;
function tickLoop() {
  const now = Date.now(), el = Math.min(600, (now - wall) / 1000); wall = now;   // catch up if the tab slept
  for (let left = el; left > 0 && !S.done; left -= 0.5) step(Math.min(0.5, left));
  secAcc += el;
  if (secAcc >= 1) {
    U.bps = U.bps * 0.5 + (S.blocks - U.lastBlocks) / secAcc * 0.5; U.lastBlocks = S.blocks;
    if (S.seen.wallet) { U.hist.push({ p:price() }); if (U.hist.length > 160) U.hist.shift(); }
    secAcc = 0; updateHum(); drawChart();
    if (S.seen.started && Math.floor(S.time) % 10 === 0) save();
  }
  checkReveal(); renderUI();
}

const saved = load();
if (saved && !saved.S.done) {
  Object.assign(S, saved.S); A.snd = saved.snd !== false; A.mus = saved.mus !== false; U.hist = saved.hist || [];
  const away = Math.min(600, Math.max(0, (Date.now() - (saved.at || Date.now())) / 1000)), before = S.mined;
  for (let left = away; left > 0 && !S.done; left -= 1) step(Math.min(1, left));
  U.lastBlocks = S.blocks;
  if (S.mined - before > 0) setTimeout(() => toast("Welcome back. Your rigs mined " + fmtBtc(S.mined - before) + " BTC while you were away."), 400);
}
if (!S.blocks) S.target = 12;                    // a predictable first block: ~12 clicks
else if (!S.target) S.target = diff() * luck();
applyAudio(); checkReveal(); renderUI(); drawChart();
setInterval(tickLoop, 100);
window.addEventListener("resize", drawChart);
window.addEventListener("beforeunload", () => { if (S.seen.started) save(); });
</script>

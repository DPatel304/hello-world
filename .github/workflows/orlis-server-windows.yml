# Builds Orlis Server.exe - the home server, for the laptop - and puts it on
# a release that's refilled each time, at an address that never changes:
#   https://github.com/dpatel304/orlis-play/releases/download/server/Orlis-Server.exe
#
# Runs when the server's code changes, or by hand (Actions > Orlis Server for
# Windows > Run workflow).
name: Orlis Server for Windows

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'astra-park/kit/**'
      - 'astra-park/src/games/pop-party*.js'
      - 'astra-park/src/games/common.js'
      - '.github/workflows/orlis-server-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orlis-server-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    env:
      # 0.1 and the build number: what the server reports, and updates itself from
      ORLIS_SERVER_VERSION: 0.1.${{ github.run_number }}
      # Orlis Play's update key: the server only installs a new exe signed with it
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            astra-park/package-lock.json

      - name: Install
        run: npm ci

      # The games the server comes with: Pop Party, as a .orlis file.
      - name: Build the starter games
        working-directory: astra-park
        run: |
          npm ci
          node kit/build-orlis.mjs

      - name: Test
        run: npm test

      - name: Build Orlis Server.exe
        run: node build-exe.mjs

      # The exe itself, started for real: it has to answer before it ships.
      - name: Check it runs
        shell: pwsh
        run: |
          $env:ORLIS_DATA = Join-Path $env:RUNNER_TEMP 'orlis-check'
          $env:ORLIS_NO_UPDATE = '1'
          $p = Start-Process -FilePath 'dist\Orlis Server.exe' -PassThru -WindowStyle Hidden
          $hello = $null
          for ($i = 0; $i -lt 20 -and -not $hello; $i++) {
            Start-Sleep -Milliseconds 500
            try { $hello = Invoke-RestMethod http://localhost:47871/api/hello } catch { }
          }
          Start-Sleep -Seconds 1
          Get-Process -Name 'Orlis Server' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $hello -or $hello.app -ne 'orlis') { throw 'Orlis Server.exe did not answer' }
          $log = Join-Path $env:ORLIS_DATA 'server.log'
          if (-not (Select-String -Path $log -Pattern 'is running' -Quiet)) { throw 'the server did not write its log' }
          Write-Host (Get-Content $log -Raw)
          if (-not (Test-Path (Join-Path $env:ORLIS_DATA 'games\pop-party.orlis'))) { throw 'Pop Party is not in the Store' }
          Write-Host "answered: $($hello | ConvertTo-Json -Compress)"

      - name: Check the icon by the clock
        shell: pwsh
        run: |
          node -e "import('./src/supervisor.js').then(m => require('fs').writeFileSync('tray.ps1', m.trayScript()))"
          $env:ORLIS_TRAY_TEST = '1'
          $said = powershell.exe -NoProfile -ExecutionPolicy Bypass -File tray.ps1
          if ($LASTEXITCODE -ne 0 -or $said -notcontains 'tray ok') { throw "the tray icon script failed: $said" }
          # (and the exe is a windowed program: no black window)
          $b = [IO.File]::ReadAllBytes('dist\Orlis Server.exe')
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $sub = [BitConverter]::ToUInt16($b, $pe + 4 + 20 + 68)
          if ($sub -ne 2) { throw "subsystem is $sub, not windowed" }
          Write-Host 'tray ok, windowed'

      # The server release is refilled each time, never emptied first: the new
      # files go up beside the old ones, and server.json - what running
      # servers read to update themselves - last. So downloads and updates
      # work the whole time.
      - name: Sign it, for servers updating themselves
        shell: bash
        run: |
          cp "dist/Orlis Server.exe" "Orlis-Server-$ORLIS_SERVER_VERSION.exe"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this server won't be offered as an update."
            exit 0
          fi
          (cd ../astra-park && npx tauri signer sign "../server/Orlis-Server-$ORLIS_SERVER_VERSION.exe")
          test -f "Orlis-Server-$ORLIS_SERVER_VERSION.exe.sig"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$ORLIS_SERVER_VERSION"; UPD="Orlis-Server-$V.exe"
          cp "dist/Orlis Server.exe" Orlis-Server.exe
          cp starter/pop-party.orlis Pop-Party.orlis
          NOTES="Orlis Server $V, the Orlis home server for the laptop. Download Orlis-Server.exe, put it in a folder of its own (its data goes beside it), and double-click it. If Windows asks, allow it on Private networks only. After that it keeps itself up to date."
          if ! gh release view server >/dev/null 2>&1; then
            gh release create server --prerelease --title "Orlis Server" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload server "$UPD" Orlis-Server.exe Pop-Party.orlis --clobber
          if [ -f "$UPD.sig" ]; then
            node -e '
              const fs = require("fs"), crypto = require("crypto"), [file, sig, version, url] = process.argv.slice(1);
              fs.writeFileSync("server.json", JSON.stringify({ version, url, pub_date: new Date().toISOString(),
                sha256: crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex"),
                signature: fs.readFileSync(sig, "utf8").trim() }, null, 2));
            ' "$UPD" "$UPD.sig" "$V" "https://github.com/$GITHUB_REPOSITORY/releases/download/server/$UPD"
            cat server.json
            gh release upload server server.json --clobber
          fi
          gh release edit server --title "Orlis Server" --notes "$NOTES" --prerelease
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/server" -f sha="$GITHUB_SHA" -F force=true >/dev/null || true
          # older servers' update copies, no longer pointed at
          gh release view server --json assets -q '.assets[].name' | grep -E '^Orlis-Server-[0-9.]+\.exe$' | grep -vx "$UPD" | while read -r old; do
            gh release delete-asset server "$old" --yes || true
          done || true   # (none to clear is fine)

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Miner</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --muted:#8e8e93; --line:#ececec; --soft:#f5f5f5; --accent:#f7931a; --good:#1a9e55; --bad:#d83a3a; color-scheme:light; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:1px solid var(--line); border-radius:999px; padding:7px 14px;
           transition:border-color .15s, background .15s, opacity .15s, transform .08s; }
  button:hover:not(:disabled) { border-color:var(--fg); }
  button:active:not(:disabled) { transform:scale(.97); }
  button:disabled { opacity:.35; cursor:default; }

  [data-reveal]:not(.shown) { display:none !important; }
  .shown { animation:fade .6s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  #hero { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:72px 16px 32px; }
  body.fresh #hero { min-height:100vh; padding-top:16px; }
  #balance { text-align:center; margin-bottom:28px; min-height:84px; }
  #bNum { font-size:48px; font-weight:600; letter-spacing:-1.5px; }
  #bUnit { font-size:18px; color:var(--muted); margin-left:4px; }
  #bSub { color:var(--muted); font-size:14px; min-height:21px; }
  #coinWrap { position:relative; width:168px; height:168px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  #ring { position:absolute; inset:-14px; width:calc(100% + 28px); height:calc(100% + 28px); transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:1.5; }
  #ring .track { stroke:var(--line); }
  #ring .prog { stroke:var(--accent); stroke-dasharray:100; stroke-dashoffset:100; }
  #coin { width:100%; height:100%; display:block; transition:transform .1s; }
  #coinWrap:active #coin { transform:scale(.95); }
  #coin.pop { animation:pop .35s ease; }
  @keyframes pop { 40% { transform:scale(1.04); } }
  .float { position:absolute; left:50%; top:10%; font-size:14px; font-weight:500; color:var(--muted); pointer-events:none; white-space:nowrap; animation:floatUp 1.1s ease-out forwards; }
  @keyframes floatUp { from { opacity:0; transform:translate(-50%, 0); } 20% { opacity:1; } to { opacity:0; transform:translate(-50%, -48px); } }
  #mine { margin-top:36px; background:var(--fg); color:#fff; border-color:var(--fg); font-size:16px; font-weight:500; padding:12px 48px; }
  #mine:hover { background:#333; border-color:#333; }
  #stats { display:flex; gap:40px; flex-wrap:wrap; justify-content:center; margin-top:40px; }
  .stat { text-align:center; }
  .stat small { display:block; color:var(--muted); font-size:12px; }
  .stat b { font-size:16px; font-weight:500; }

  #grid { max-width:1160px; margin:0 auto; padding:16px 16px 72px; display:flex; flex-wrap:wrap; justify-content:center; gap:20px; align-items:flex-start; }
  .card { flex:1 1 300px; max-width:360px; border:1px solid var(--line); border-radius:16px; padding:22px; min-width:0; }
  .card-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:30px; }
  .card h3 { margin:0; font-size:14px; font-weight:600; }
  .muted { color:var(--muted); }
  .up { color:var(--good); } .down { color:var(--bad); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .nm { min-width:0; }
  .row .nm b { font-weight:500; }
  .row .nm .cnt { color:var(--muted); margin-left:6px; }
  .row .nm small { display:block; color:var(--muted); font-size:12px; }
  .row button { min-width:92px; font-size:13px; white-space:nowrap; }
  .seg { display:flex; gap:2px; }
  .seg button { border:0; padding:4px 10px; font-size:13px; color:var(--muted); }
  .seg button.on { color:var(--fg); background:var(--soft); }
  .kv { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
  .kv span:first-child { color:var(--muted); }
  .bar { height:4px; border-radius:99px; background:var(--soft); overflow:hidden; margin:6px 0 10px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  #price { font-size:28px; font-weight:600; letter-spacing:-.5px; }
  #chart { width:100%; height:96px; display:block; margin:14px 0 8px; }
  .note { font-size:12px; color:var(--muted); margin-top:10px; }
  #news { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); min-height:20px; }
  .brown { color:var(--bad); }

  #ctl { position:fixed; top:14px; right:14px; display:flex; gap:4px; z-index:5; }
  #ctl button { border:0; font-size:12px; color:var(--muted); padding:6px 10px; }
  #ctl button.on { color:var(--fg); }
  #toasts { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; z-index:6; pointer-events:none; width:calc(100% - 32px); }
  .toast { background:var(--fg); color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; animation:toast 4s ease forwards; max-width:460px; text-align:center; }
  .toast.big { background:var(--accent); }
  @keyframes toast { 0% { opacity:0; transform:translateY(6px); } 8%, 85% { opacity:1; transform:none; } 100% { opacity:0; } }
  #end { position:fixed; inset:0; background:rgba(255,255,255,.85); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #end .card { flex:none; width:100%; max-width:400px; background:#fff; text-align:center; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.08); }
  #end h2 { margin:16px 0 4px; font-size:24px; font-weight:600; letter-spacing:-.5px; }
  #end .kv { text-align:left; }
  #foot { text-align:center; padding:0 16px 40px; }
  #foot button { border:0; color:var(--muted); font-size:12px; }
  @media (max-width:420px) { #bNum { font-size:40px; } #stats { gap:22px; } #hero { padding-top:56px; } }
</style>
</head>
<body class="fresh">
<div id="ctl" data-reveal="started"><button id="sndBtn" class="on">Sound</button><button id="musBtn" class="on">Music</button></div>

<section id="hero">
  <div id="balance"><div data-reveal="started"><span id="bNum">0</span><span id="bUnit">sats</span></div><div id="bSub"></div></div>
  <div id="coinWrap" title="Mine">
    <svg id="ring" viewBox="0 0 100 100" data-reveal="network"><circle class="track" cx="50" cy="50" r="49"/><circle class="prog" cx="50" cy="50" r="49" pathLength="100"/></svg>
    <svg id="coin" viewBox="0 0 200 200" aria-label="Bitcoin">
      <circle cx="100" cy="100" r="100" fill="#f7931a"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
      <g transform="rotate(14 100 100)" fill="#fff">
        <rect x="84" y="42" width="8" height="16" rx="2"/><rect x="104" y="42" width="8" height="16" rx="2"/>
        <rect x="84" y="142" width="8" height="16" rx="2"/><rect x="104" y="142" width="8" height="16" rx="2"/>
        <text x="100" y="136" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="100">B</text>
      </g>
    </svg>
  </div>
  <button id="mine">Mine</button>
  <div id="stats" data-reveal="stats">
    <div class="stat"><small>Hashrate</small><b id="sHash">0</b></div>
    <div class="stat"><small>Network share</small><b id="sShare">0%</b></div>
    <div class="stat"><small>Power</small><b id="sPow">0</b></div>
  </div>
</section>

<section id="grid">
  <div class="card" data-reveal="hardware">
    <div class="card-h"><h3>Hardware</h3>
      <div class="seg" id="qtySeg"><button data-q="1" class="on">×1</button><button data-q="10">×10</button><button data-q="max">Max</button></div></div>
    <div id="tiers"></div>
  </div>
  <div class="card" data-reveal="upgrades">
    <div class="card-h"><h3>Upgrades</h3></div>
    <div id="ups"></div>
  </div>
  <div class="card" data-reveal="network">
    <div class="card-h"><h3>Network</h3><span class="muted" id="epTxt"></span></div>
    <div class="kv"><span>Bitcoin in existence</span><span id="supTxt"></span></div>
    <div class="bar"><i id="supBar"></i></div>
    <div class="kv"><span>Network hashrate</span><span id="nHash"></span></div>
    <div class="kv"><span>Block reward</span><span id="nReward"></span></div>
    <div class="kv"><span id="nHalvLbl">Next halving</span><span id="nHalv"></span></div>
    <div class="kv"><span>You've mined</span><span id="nMined"></span></div>
    <div id="news"></div>
  </div>
  <div class="card" data-reveal="market">
    <div class="card-h"><h3>Market</h3><span id="chg"></span></div>
    <div id="price">$0.05</div><div class="muted" style="font-size:13px">per bitcoin · your stack ≈ <span id="worth"></span></div>
    <canvas id="chart"></canvas>
    <div class="note">Hardware is priced in dollars, so it costs fewer sats when bitcoin is up.</div>
  </div>
</section>
<div id="foot" data-reveal="hardware"><button id="resetBtn">Reset progress</button></div>
<div id="toasts"></div>
<div id="end" style="display:none"></div>

<script>
"use strict";
//#CORE-START
// Everything is denominated in satoshis (1 BTC = 1e8 sats).
// You are one miner on a network that keeps mining on Bitcoin's schedule (compressed in time).
// Each block's reward is split by hashrate share; the game ends when all 21M BTC exist.
const SAT = 1e8;
const CFG = {
  CAP:21e6 * SAT, EPOCHS:10, EP:210,          // 10 halvings, 210 blocks per epoch (scaled from 210,000)
  R0:50000 * SAT,                              // first-epoch block reward, so 2 * 210 * R0 = 21M BTC
  BT:300 / 210,                                // seconds per network block (5-minute epochs)
  CLICK:0.01,                                  // the very first click pays 0.01 sat
  NG:3e-4,                                     // network hashrate growth per second
  P0:0.05, PG:4.8e-3,                          // BTC/USD starts at $0.05 and trends up
  ER:0.004,                                    // electricity: sats per watt, relative to mining yield
  GROW:1.15, DX:0.6,                           // each extra machine costs 15% more; DX: how strongly sat-prices follow BTC price
};
CFG.N0 = CFG.R0 / (CFG.BT * CFG.CLICK);        // network hashrate that makes one hash worth 0.01 sat

const TIERS = [   // cost is in sats at the starting BTC price
  { id:"cpu",  name:"Laptop CPU",       cost:0.5,      hash:1,        watts:45 },
  { id:"gpu",  name:"Gaming GPU",       cost:25,       hash:60,       watts:1.42e3 },
  { id:"rig",  name:"GPU Rig",          cost:1.25e3,   hash:3.6e3,    watts:4.49e4 },
  { id:"fpga", name:"FPGA Cluster",     cost:6.25e4,   hash:2.16e5,   watts:1.42e6 },
  { id:"asic", name:"ASIC Miner",       cost:3.12e6,   hash:1.3e7,    watts:4.48e7 },
  { id:"rack", name:"ASIC Rack",        cost:1.56e8,   hash:7.78e8,   watts:1.41e9 },
  { id:"farm", name:"Mining Farm",      cost:7.81e9,   hash:4.67e10,  watts:4.46e10 },
  { id:"dc",   name:"Hyperscale Site",  cost:3.91e11,  hash:2.8e12,   watts:1.41e12 },
  { id:"fus",  name:"Fusion Campus",    cost:1.95e13,  hash:1.68e14,  watts:4.45e13 },
];
// hm: hashrate x, wm: watts x, em: electricity price x, cm: click x
const UPS = [
  { id:"mouse",   name:"Better Mouse",        desc:"Clicks ×3",               cost:0.5,   cm:3 },
  { id:"oc",      name:"Overclocking",        desc:"Hashrate ×1.25",          cost:13.8,    hm:1.25, wm:1.15 },
  { id:"macro",   name:"Click Macro",         desc:"Clicks ×10",              cost:383,   cm:10 },
  { id:"offpeak", name:"Off-Peak Power",      desc:"Electricity −30%",        cost:1.06e4,   em:0.7 },
  { id:"firm",    name:"Custom Firmware",     desc:"Hashrate ×1.5",           cost:2.93e5,   hm:1.5 },
  { id:"hydro",   name:"Hydro Contract",      desc:"Electricity −40%",        cost:8.1e6,   em:0.6 },
  { id:"immerse", name:"Immersion Cooling",   desc:"Hashrate ×1.6",           cost:2.24e8,   hm:1.6, wm:0.9 },
  { id:"stratum", name:"Stratum V2",          desc:"Hashrate ×1.5",           cost:6.19e9,  hm:1.5 },
  { id:"solar",   name:"Solar + Batteries",   desc:"Electricity −50%",        cost:1.71e11,  em:0.5 },
  { id:"chip",    name:"3nm Chips",           desc:"Hashrate ×2",             cost:4.74e12,  hm:2 },
];

const randn = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*Math.random()); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const H = { block(){}, halving(){}, final(){}, event(){}, majority(){} };   // UI hooks

function newState() {
  return { sats:0, mined:0, supply:0, height:0, blockT:0, time:0, lm:0, evT:50, hw:TIERS.map(() => 0), ups:{},
           clicks:0, spent:0, done:false, brown:false, majority:false, seen:{} };
}
let S = newState();

const epoch     = () => Math.min(CFG.EPOCHS - 1, Math.floor(S.height / CFG.EP));
const reward    = () => CFG.R0 / Math.pow(2, epoch());
// everyone else: a base network that grows slowly, plus rivals who pile in as your operation grows
// (so your share climbs with diminishing returns instead of running away)
function netHash() {
  const b = CFG.N0 * Math.exp(CFG.NG * S.time), h = hashrate();
  return b + Math.pow(b, 0.25) * Math.pow(h, 0.75);
}
const price     = () => CFG.P0 * Math.exp(CFG.PG * S.time + S.lm);   // USD per BTC
function mult(k) { let m = 1; for (const u of UPS) if (S.ups[u.id] && u[k]) m *= u[k]; return m; }
const rawHash   = () => { let h = 0; for (let i = 0; i < TIERS.length; i++) h += S.hw[i] * TIERS[i].hash; return h * mult("hm"); };
const hashrate  = () => rawHash() * (S.brown ? 0.2 : 1);
const share     = () => { const h = hashrate(); return h / (h + netHash()); };
const yieldPerHash = () => reward() / (CFG.BT * (hashrate() + netHash()));    // sats per hash
const income    = () => hashrate() * yieldPerHash();                          // sats per second
const clickPow  = () => mult("cm");
const clickValue = () => clickPow() * yieldPerHash();
const watts     = () => { let w = 0; for (let i = 0; i < TIERS.length; i++) w += S.hw[i] * TIERS[i].watts; return w * mult("wm"); };
// electricity is priced against mining yield, so inefficient hardware stays inefficient all game
const powerCost = () => watts() * CFG.ER * mult("em") * yieldPerHash();
// hardware has a dollar price, so it costs fewer sats as bitcoin's price rises (and more during a crash)
const satsPerDollarRatio = () => Math.pow(CFG.P0 / price(), CFG.DX);
const costN = (i, n) => satsPerDollarRatio() * TIERS[i].cost * Math.pow(CFG.GROW, S.hw[i]) * (Math.pow(CFG.GROW, n) - 1) / (CFG.GROW - 1);
function maxAff(i) {
  const base = satsPerDollarRatio() * TIERS[i].cost * Math.pow(CFG.GROW, S.hw[i]);
  return Math.max(0, Math.floor(Math.log(1 + S.sats * (CFG.GROW - 1) / base) / Math.log(CFG.GROW)));
}
const upCost = u => satsPerDollarRatio() * u.cost;

function earn(x) { S.sats += x; S.mined += x; }
function buyTier(i, qty) {
  const n = qty === "max" ? maxAff(i) : qty; if (n < 1) return false;
  const c = costN(i, n); if (c > S.sats) return false;
  S.sats -= c; S.spent += c; S.hw[i] += n; return true;
}
function buyUp(id) {
  const u = UPS.find(x => x.id === id); if (!u || S.ups[id]) return false;
  const c = upCost(u); if (c > S.sats) return false;
  S.sats -= c; S.spent += c; S.ups[id] = true; return true;
}
function click() { if (S.done) return 0; const v = clickValue(); earn(v); S.clicks++; return v; }

function networkBlock() {
  S.height++;
  const last = S.height >= CFG.EP * CFG.EPOCHS;
  const r = last ? CFG.CAP - S.supply : reward();     // the final block carries the remaining dust
  S.supply += r;
  if (last) { earn(r * share()); S.done = true; H.block(r); H.final(); return; }
  H.block(r);
  if (S.height % CFG.EP === 0) { S.lm = clamp(S.lm + 0.25, -1.5, 1.2); H.halving(epoch()); }
}

function step(dt) {
  if (S.done) return;
  S.time += dt;
  S.lm = clamp(S.lm + (-0.04 * S.lm) * dt + 0.035 * Math.sqrt(dt) * randn(), -1.5, 1.2);
  S.evT -= dt;
  if (S.evT <= 0) {
    S.evT = 40 + Math.random() * 60;
    const r = Math.random();
    if (r < 0.35)      { S.lm = clamp(S.lm + 0.35 + Math.random() * 0.3, -1.5, 1.2); H.event("pump", Math.random()); }
    else if (r < 0.7)  { S.lm = clamp(S.lm - 0.4 - Math.random() * 0.3, -1.5, 1.2); H.event("crash", Math.random()); }
    else               { H.event("news", Math.random()); }
  }
  // power is paid in sats; if you can't pay, the rigs throttle
  const pc = powerCost() * dt;
  if (S.sats >= pc) { S.sats -= pc; S.spent += pc; S.brown = false; } else { S.brown = rawHash() > 0; }
  earn(income() * dt);
  if (!S.majority && share() > 0.5) { S.majority = true; H.majority(); }
  S.blockT += dt;
  while (S.blockT >= CFG.BT && !S.done) { S.blockT -= CFG.BT; networkBlock(); }
}
//#CORE-END

// ================= UI =================
const $ = id => document.getElementById(id);
const SAVE_KEY = "blockminer-v2";
const U = { qty:1, hist:[], upKey:"", lastFloat:0, lastChime:0, lastReveal:0, peakShare:0 };

// --- formatting: sats until 0.01 BTC, then BTC ---
function satsParts(n) {
  if (n <= 0) return ["0", "sats"];
  if (n < 10) return [n.toFixed(2), "sats"];
  if (n < 1000) return [n.toFixed(1), "sats"];
  if (n < 1e6) return [Math.floor(n).toLocaleString("en-US"), "sats"];
  const b = n / SAT;
  return [b < 1 ? b.toFixed(4) : b < 1000 ? b.toFixed(3) : Math.floor(b).toLocaleString("en-US"), "BTC"];
}
const fmtSats = n => satsParts(n).join(" ");
function fmtN(n) {
  if (Math.abs(n) < 1000) return n.toFixed(Math.abs(n) < 10 ? 2 : Math.abs(n) < 100 ? 1 : 0);
  const u = ["K","M","B","T","Q"]; let i = -1;
  while (Math.abs(n) >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(2) + u[i];
}
const fmtUsd = n => "$" + (n < 1000 ? n.toFixed(2) : fmtN(n));
function fmtUnit(n, us) { let i = 0; while (n >= 1000 && i < us.length - 1) { n /= 1000; i++; } return (n < 10 && i ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + " " + us[i]; }
const fmtH = n => fmtUnit(n, ["H/s","kH/s","MH/s","GH/s","TH/s","PH/s","EH/s","ZH/s","YH/s"]);
const fmtW = n => fmtUnit(n, ["W","kW","MW","GW","TW","PW"]);
const fmtPct = x => (x < 0.0001 ? "<0.01" : x < 0.01 ? (x * 100).toFixed(2) : (x * 100).toFixed(1)) + "%";

function toast(msg, kind = "") {
  const box = $("toasts"), t = document.createElement("div");
  t.className = "toast " + kind; t.textContent = msg; box.appendChild(t);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => t.remove(), 4000);
}
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ================= PROGRESSIVE REVEAL =================
const totalHw = () => S.hw.reduce((a, b) => a + b, 0);
const STAGES = [
  ["started",  () => S.clicks > 0],
  ["hardware", () => S.mined >= 0.3,                                "Hardware unlocked. Machines mine while you rest."],
  ["stats",    () => totalHw() > 0],
  ["upgrades", () => totalHw() >= 2,                                "Upgrades unlocked."],
  ["network",  () => totalHw() >= 8 || S.mined >= 20,               "You're one tiny miner on a big network. Grow your share."],
  ["market",   () => S.seen.network && (totalHw() >= 18 || S.height >= CFG.EP), "Market unlocked. Buy hardware when bitcoin is up."],
];
function checkReveal() {
  const now = performance.now();
  for (const [k, cond, msg] of STAGES) {
    if (S.seen[k] || !cond()) continue;
    if (msg && now - U.lastReveal < 2500) break;            // one unlock at a time
    S.seen[k] = true; if (msg) { toast(msg); U.lastReveal = now; break; }
  }
  document.querySelectorAll("[data-reveal]").forEach(el => el.classList.toggle("shown", !!S.seen[el.dataset.reveal]));
  document.body.classList.toggle("fresh", !S.seen.hardware);
}

// ================= AUDIO (synthesized, soft) =================
const A = { ctx:null, snd:true, mus:true };
function audioInit() {
  if (A.ctx) { if (A.ctx.state !== "running") A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const c = A.ctx = new AC();
  A.master = c.createGain(); A.master.gain.value = 0.5; A.master.connect(c.destination);
  A.sfx = c.createGain(); A.sfx.connect(A.master);
  A.mg = c.createGain(); A.mg.connect(A.master);
  A.humG = c.createGain(); A.humG.gain.value = 0; A.humG.connect(A.master);
  A.o1 = c.createOscillator(); A.o1.type = "sine"; A.o1.frequency.value = 55; A.o1.connect(A.humG); A.o1.start();
  A.o2 = c.createOscillator(); A.o2.type = "sine"; A.o2.frequency.value = 110.4; A.o2.connect(A.humG); A.o2.start();
  const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  A.noise = c.createBufferSource(); A.noise.buffer = buf; A.noise.loop = true;
  A.nF = c.createBiquadFilter(); A.nF.type = "lowpass"; A.nF.frequency.value = 500;
  A.nG = c.createGain(); A.nG.gain.value = 0; A.noise.connect(A.nF); A.nF.connect(A.nG); A.nG.connect(A.master); A.noise.start();
  applyAudio();
  setInterval(musicStep, 450);
}
function applyAudio() {
  $("sndBtn").classList.toggle("on", A.snd); $("sndBtn").textContent = A.snd ? "Sound on" : "Sound off";
  $("musBtn").classList.toggle("on", A.mus); $("musBtn").textContent = A.mus ? "Music on" : "Music off";
  if (A.ctx) { A.sfx.gain.value = A.snd ? 1 : 0; A.mg.gain.value = A.mus ? 1 : 0; }
}
function tone(f, dur, type = "sine", vol = 0.07, slide = 0, delay = 0, out) {
  if (!A.ctx || A.ctx.state !== "running") return;
  const c = A.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out || A.sfx); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  click: () => tone(560 + Math.random() * 60, 0.06, "sine", 0.06, -140),
  block: () => { tone(1318.5, 0.3, "sine", 0.04); tone(1975.5, 0.4, "sine", 0.03, 0, 0.06); },
  buy:   () => { tone(660, 0.09, "sine", 0.05); tone(880, 0.12, "sine", 0.05, 0, 0.06); },
  err:   () => tone(180, 0.14, "sine", 0.06, -40),
  pump:  () => [523, 659, 784].forEach((f, i) => tone(f, 0.25, "sine", 0.04, 0, i * 0.08)),
  crash: () => tone(392, 0.7, "sine", 0.06, -230),
  big:   () => { tone(65.4, 2.6, "sine", 0.2); [392, 523, 659, 784].forEach((f, i) => tone(f, 1.1, "sine", 0.04, 0, 0.25 + i * 0.16)); },
  final: () => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 2, "sine", 0.05, 0, i * 0.2)); tone(65.4, 4, "sine", 0.2); },
};
const SCALE = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
const PATS = [[0,2,4,2,5,4,2,1],[0,4,5,7,5,4,2,4],[2,4,6,4,7,6,4,5],[0,2,4,7,6,4,2,1]];
let mStep = 0;
function musicStep() {
  if (!A.ctx || !A.mus || S.done || !S.seen.hardware) return;
  const e = epoch(), k = mStep++, pat = PATS[(Math.floor(k / 32) + e) % PATS.length];
  tone(SCALE[pat[k % 8]] * (e >= 5 ? 2 : 1), 0.6, "sine", 0.022, 0, 0, A.mg);
  if (k % 8 === 0) tone(SCALE[pat[0]] / 2, 2.4, "sine", 0.03, 0, 0, A.mg);
}
function updateHum() {
  if (!A.ctx) return;
  const h = hashrate(), lvl = clamp(Math.log10(h + 1) / 15, 0, 1), t = A.ctx.currentTime, on = A.snd && h > 0 && !S.done ? 1 : 0;
  A.humG.gain.setTargetAtTime(on * (0.01 + 0.025 * lvl), t, 0.6);
  A.nG.gain.setTargetAtTime(on * (0.002 + 0.014 * lvl), t, 0.6);
  A.o1.frequency.setTargetAtTime(50 + 25 * lvl, t, 1); A.o2.frequency.setTargetAtTime(100.4 + 50 * lvl, t, 1);
  A.nF.frequency.setTargetAtTime(400 + 1400 * lvl, t, 1);
}

// ================= GAME HOOKS =================
const NEWS = {
  pump:  ["Pizza shop now accepts Bitcoin", "Celebrity tweets 'to the moon'", "Major exchange lists BTC", "A whale buys the dip", "Hedge fund adds BTC to its treasury", "ETF approved"],
  crash: ["Exchange hacked, panic selling", "Government announces a crackdown", "FUD spreads on the forums", "A whale dumps its bag", "Mining ban rumored abroad", "Regulator calls it a bubble"],
  news:  ["New ASIC announced", "Forum asks: is mining still worth it?", "Electricity prices wobble", "Someone lost their keys in a landfill", "Laser eyes are trending", "Satoshi is still missing"],
};
H.block = () => {
  const now = performance.now();
  if (S.seen.network && share() >= 0.01 && now - U.lastChime > 1000) { U.lastChime = now; SFX.block(); restart($("coin"), "pop"); }
};
H.halving = () => {
  if (S.seen.network) { SFX.big(); toast("Halving: the block reward is now " + fmtSats(reward()), "big"); }
  U.hist.push({ p:price(), halv:true });
};
H.majority = () => { SFX.big(); toast("You now control over half the network's hashrate", "big"); };
H.event = (type, r) => {
  const list = NEWS[type], msg = list[Math.floor(r * list.length)];
  $("news").innerHTML = `<span class="${type === "pump" ? "up" : type === "crash" ? "down" : ""}">${type === "pump" ? "▲" : type === "crash" ? "▼" : "·"}</span> ${msg}`;
  if (!S.seen.market) return;
  if (type === "pump") { SFX.pump(); toast("▲ " + msg + ". Hardware is cheaper in sats"); }
  if (type === "crash") { SFX.crash(); toast("▼ " + msg); }
};
H.final = () => {
  SFX.final(); save();
  setTimeout(() => {
    const m = Math.floor(S.time / 60), s = Math.floor(S.time % 60), pct = S.mined / CFG.CAP * 100, e = $("end");
    e.innerHTML = `<div class="card">
      <svg viewBox="0 0 200 200" width="64" height="64">${$("coin").innerHTML}</svg>
      <h2>All 21,000,000 bitcoin mined</h2>
      <p class="muted" style="margin:0 0 18px">You mined <b style="color:var(--fg)">${fmtSats(S.mined)}</b>, ${pct.toFixed(2)}% of all bitcoin.<br>Satoshi mined about 5%.</p>
      <div class="kv"><span>Still holding</span><span>${fmtSats(S.sats)}</span></div>
      <div class="kv"><span>Worth</span><span>${fmtUsd(S.sats / SAT * price())}</span></div>
      <div class="kv"><span>Peak network share</span><span>${fmtPct(U.peakShare)}</span></div>
      <div class="kv"><span>Time</span><span>${m}m ${s}s</span></div>
      <div class="kv"><span>Clicks</span><span>${S.clicks.toLocaleString()}</span></div>
      <button id="againBtn" style="margin-top:20px;width:100%;background:var(--fg);color:#fff;border-color:var(--fg);padding:11px">Play again</button></div>`;
    e.style.display = "";
    $("againBtn").onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (err) {} location.reload(); };
  }, 1500);
};

// ================= CONTROLS =================
function doMine() {
  audioInit();
  const v = click(); SFX.click(); restart($("coin"), "pop");
  const now = performance.now();
  if (v > 0 && now - U.lastFloat > 90) {
    U.lastFloat = now;
    const f = document.createElement("div"); f.className = "float"; f.textContent = "+" + fmtSats(v);
    f.style.marginLeft = (Math.random() * 50 - 25) + "px";
    $("coinWrap").appendChild(f); f.addEventListener("animationend", () => f.remove());
  }
  checkReveal(); renderUI();
}
$("mine").onclick = doMine;
$("coinWrap").onclick = doMine;
$("mine").addEventListener("keyup", e => { if (e.code === "Space") e.preventDefault(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" && (e.target === document.body || e.target === $("mine"))) { e.preventDefault(); if (!e.repeat) doMine(); }
});
document.addEventListener("pointerdown", audioInit);
$("qtySeg").querySelectorAll("button").forEach(b => b.onclick = () => {
  U.qty = b.dataset.q === "max" ? "max" : +b.dataset.q;
  $("qtySeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderUI();
});
$("sndBtn").onclick = () => { A.snd = !A.snd; applyAudio(); updateHum(); save(); };
$("musBtn").onclick = () => { A.mus = !A.mus; applyAudio(); save(); };
$("resetBtn").onclick = () => { if (confirm("Reset all progress and start over?")) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); } };

const tierRows = TIERS.map((t, i) => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div class="nm"><b>${t.name}</b><span class="cnt"></span><small></small></div><button></button>`;
  const btn = row.querySelector("button");
  btn.onclick = () => { const had = S.hw[i]; if (buyTier(i, U.qty)) { SFX.buy(); if (!had) toast(t.name + " online"); checkReveal(); renderUI(); } else SFX.err(); };
  $("tiers").appendChild(row);
  return { row, cnt:row.querySelector(".cnt"), info:row.querySelector("small"), btn };
});

function renderUps() {
  const list = UPS.filter(u => !S.ups[u.id]).slice(0, 3), key = list.map(u => u.id).join();
  if (key !== U.upKey) {
    U.upKey = key; const box = $("ups"); box.innerHTML = "";
    if (!list.length) box.innerHTML = '<div class="muted" style="font-size:13px">Every upgrade purchased.</div>';
    for (const u of list) {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<div class="nm"><b>${u.name}</b><small>${u.desc}</small></div><button data-id="${u.id}"></button>`;
      row.querySelector("button").onclick = () => { if (buyUp(u.id)) { SFX.buy(); toast(u.name + " installed"); renderUI(); } else SFX.err(); };
      box.appendChild(row);
    }
  }
  $("ups").querySelectorAll("button[data-id]").forEach(b => {
    const c = upCost(UPS.find(x => x.id === b.dataset.id)); b.textContent = fmtSats(c); b.disabled = c > S.sats;
  });
}

function renderUI() {
  const h = hashrate(), [num, unit] = satsParts(S.sats);
  $("bNum").textContent = num; $("bUnit").textContent = unit;
  $("bSub").innerHTML = !S.seen.started ? "" :
    S.brown ? '<span class="brown">Can’t pay for power. Rigs are throttled.</span>' :
    h > 0 ? "+" + fmtSats(Math.max(0, income() - powerCost())) + " / sec" : fmtSats(clickValue()) + " per click";
  if (S.seen.stats) {
    $("sHash").textContent = fmtH(h); $("sShare").textContent = fmtPct(share()); $("sPow").textContent = fmtW(watts());
  }
  if (S.seen.network) {
    $("ring").querySelector(".prog").style.strokeDashoffset = 100 - (S.blockT / CFG.BT) * 100;
    const left = (epoch() + 1) * CFG.EP - S.height, last = epoch() === CFG.EPOCHS - 1;
    $("epTxt").textContent = "Block " + S.height.toLocaleString() + " of " + (CFG.EP * CFG.EPOCHS).toLocaleString();
    $("supTxt").textContent = Math.floor(S.supply / SAT).toLocaleString("en-US") + " / 21M";
    $("supBar").style.width = (S.supply / CFG.CAP * 100) + "%";
    $("nHash").textContent = fmtH(netHash());
    $("nReward").textContent = fmtSats(reward());
    $("nHalvLbl").textContent = last ? "Final block in" : "Next halving in";
    $("nHalv").textContent = left + " blocks";
    $("nMined").textContent = fmtSats(S.mined);
  }
  if (S.seen.hardware) TIERS.forEach((t, i) => {
    const r = tierRows[i], n = U.qty === "max" ? Math.max(1, maxAff(i)) : U.qty, c = costN(i, n);
    r.row.style.display = i === 0 || S.hw[i] > 0 || S.hw[i - 1] > 0 ? "" : "none";
    r.cnt.textContent = S.hw[i] ? "×" + S.hw[i] : "";
    r.info.textContent = fmtH(t.hash * mult("hm")) + " · " + fmtW(t.watts * mult("wm"));
    r.btn.textContent = (n > 1 ? n + " · " : "") + fmtSats(c); r.btn.disabled = c > S.sats;
  });
  if (S.seen.upgrades) renderUps();
  if (S.seen.market) {
    const p = price(), ref = U.hist.length > 30 ? U.hist[U.hist.length - 30].p : U.hist.length ? U.hist[0].p : p, ch = (p / ref - 1) * 100;
    $("price").textContent = fmtUsd(p);
    $("worth").textContent = fmtUsd(S.sats / SAT * p);
    $("chg").textContent = (ch >= 0 ? "▲ " : "▼ ") + Math.abs(ch).toFixed(1) + "%"; $("chg").className = ch >= 0 ? "up" : "down";
  }
}

// ================= CHART =================
function drawChart() {
  const cv = $("chart"); if (!S.seen.market) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hgt = cv.clientHeight; if (!w) return;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hgt);
  const d = U.hist; if (d.length < 2) return;
  let lo = Infinity, hi = -Infinity;
  for (const e of d) { const l = Math.log(e.p); lo = Math.min(lo, l); hi = Math.max(hi, l); }
  if (hi - lo < 0.1) { const m = (hi + lo) / 2; lo = m - 0.05; hi = m + 0.05; }
  const X = i => i / (d.length - 1) * (w - 4), Y = p => hgt - 4 - (Math.log(p) - lo) / (hi - lo) * (hgt - 8);
  c.strokeStyle = "#e5e5e5"; c.lineWidth = 1; c.setLineDash([2, 4]);
  d.forEach((e, i) => { if (e.halv) { c.beginPath(); c.moveTo(X(i), 0); c.lineTo(X(i), hgt); c.stroke(); } });
  c.setLineDash([]); c.beginPath();
  d.forEach((e, i) => i ? c.lineTo(X(i), Y(e.p)) : c.moveTo(0, Y(e.p)));
  c.strokeStyle = "#111"; c.lineWidth = 1.5; c.lineJoin = "round"; c.stroke();
  c.beginPath(); c.arc(X(d.length - 1), Y(d[d.length - 1].p), 3, 0, Math.PI * 2); c.fillStyle = "#f7931a"; c.fill();
}

// ================= LOOP / SAVE =================
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ S, snd:A.snd, mus:A.mus, hist:U.hist.slice(-150), peak:U.peakShare, at:Date.now() })); } catch (e) {}
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && d.S ? d : null; } catch (e) { return null; }
}
let wall = Date.now(), secAcc = 0;
function tickLoop() {
  const now = Date.now(), el = Math.min(600, (now - wall) / 1000); wall = now;   // catch up if the tab slept
  if (S.seen.started) for (let left = el; left > 0 && !S.done; left -= 0.5) step(Math.min(0.5, left));   // the clock starts at your first click
  U.peakShare = Math.max(U.peakShare, share());
  secAcc += el;
  if (secAcc >= 1) {
    secAcc = 0;
    U.hist.push({ p:price() }); if (U.hist.length > 160) U.hist.shift();
    updateHum(); drawChart();
    if (S.seen.started && Math.floor(S.time) % 10 === 0) save();
  }
  checkReveal(); renderUI();
}

const saved = load();
if (saved && !saved.S.done) {
  Object.assign(S, saved.S); S.seen = S.seen || {};
  A.snd = saved.snd !== false; A.mus = saved.mus !== false; U.hist = saved.hist || []; U.peakShare = saved.peak || 0;
  const away = Math.min(600, Math.max(0, (Date.now() - (saved.at || Date.now())) / 1000)), before = S.mined;
  for (let left = away; left > 0 && !S.done; left -= 1) step(Math.min(1, left));
  if (S.mined - before > 0.01) setTimeout(() => toast("Welcome back. You mined " + fmtSats(S.mined - before) + " while away."), 400);
}
applyAudio(); checkReveal(); renderUI(); drawChart();
setInterval(tickLoop, 100);
window.addEventListener("resize", drawChart);
window.addEventListener("beforeunload", () => { if (S.seen.started) save(); });
</script>

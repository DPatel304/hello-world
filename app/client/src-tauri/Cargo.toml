[package]
name = "orlis-play"
version = "0.1.0"
description = "Orlis Play"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Windows only: the browser engine's own controls, to let the game use the
# camera without asking.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
windows-core = "0.62"
